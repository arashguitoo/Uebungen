<style>
  :root{--akzent:#5b4fa3;--akzent-hell:#eeebf8}

  }
  addEventListener('error', function (e) { if (!window.__ok) zeige(e.message); });

<script type="module">
window.__ok = true;
import { starte, navigation } from './spieler.js?v=20261014c';
import { zeige, punkte, fmt } from './aufgaben.js?v=20261014c';
import { esc } from './db.js?v=20261014c';
import { ITEMS, THEMEN, KASUS, anzeige, satzVoll, mische, aufgabeFuer, zufallsAufgabe, lernplan, bewerte, stufe, statistik, fehlerListe } from './wortverbindungen.js?v=20261014c';
import { FAMILIEN } from './wv-daten.js?v=20261014c';

const app = document.getElementById('app');
const L = await starte('verben-praep');
if (!L.frei) { L.sperre(app); throw new Error('gesperrt'); }
const lab = {}; ITEMS.forEach(e => lab[e.id] = THEMEN[e.t].kurz + ': ' + anzeige(e)); L.registriereItems(lab);

/* ---------------- Einstellungen ---------------- */
const EK = 'ueb_wv_einst';
const lies = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const schreib = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
const E = Object.assign({ themen: ['V', 'N', 'A', 'NVV'], umfang: 3, praep: [] }, lies(EK, {}));
const PRAEPS = [...new Set(ITEMS.filter(e => e.t !== 'NVV' && e.p !== 'als').map(e => e.p))].sort((a, b) => a.localeCompare(b, 'de'));
const pool = () => ITEMS.filter(e => E.themen.includes(e.t) && e.h <= E.umfang && (e.t === 'NVV' || !E.praep.length || E.praep.includes(e.p)));
const UMFANG = { 1: 'Grundwortschatz ★★★', 2: '★★★ + ★★', 3: 'Alles' };
const sterne = h => '★'.repeat(4 - h) + '<span style="color:#ddd">' + '★'.repeat(h - 1) + '</span>';
const STUFENFARBE = ['#bbb', '#e0a03c', '#e0a03c', '#6aa6d8', '#6aa6d8', '#3f9a63'];

let lauf = 0, aktiv = false;
const nav = navigation(L, { zurueck: () => { lauf++; aktiv = false; startbild(); }, fortschritt: () => aktiv });
app.addEventListener('click', e => { if (e.target.closest('#raus')) nav.zurStart(); });
const kopf = t => `<div class="zeile" style="margin-bottom:8px"><button class="btn zweit klein" id="raus">←<span class="lang"> Start</span></button><b style="flex:1">${t}</b></div>`;

/* ---------------- Start ---------------- */
function startbild() {
  lauf++;
  const p = pool(), st = statistik(p), plan = lernplan(p);
  const themenKarte = t => { const ps = ITEMS.filter(e => e.t === t && e.h <= E.umfang), s = statistik(ps), n = ps.length || 1;
    return `<button class="thema ${E.themen.includes(t) ? 'an' : ''}" data-t="${t}"><b>${THEMEN[t].icon} ${THEMEN[t].name}</b><span class="leise klein">${ps.length} Einträge · ${s.faellig} fällig · ${s.neu} neu</span>
      <div class="stapel"><i class="s-lernen" style="width:${100 * s.lernen / n}%"></i><i class="s-fest" style="width:${100 * s.fest / n}%"></i><i class="s-sicher" style="width:${100 * s.sicher / n}%"></i></div></button>`; };
  const nf = fehlerListe(p).length;
  app.innerHTML = `<div class="karte start" style="margin-top:14px">
    <span class="pille">B1/B2 · Grammatik & Wortschatz</span>
    <h1>Präpositionen & Wortverbindungen</h1>
    <p>Verben, Nomen und Adjektive mit Präposition – und feste Nomen-Verb-Verbindungen. ${ITEMS.length} Einträge. Neues lernst du zuerst kennen (<b>Begegnung</b>), dann kommt es in wachsenden Abständen wieder (<b>Wiederholung</b>), bis es sicher sitzt.</p>
    <div class="modi">
      <button class="modus haupt" id="m-lernen" ${p.length ? '' : 'disabled'}><span class="ic">🌱</span><b>Heute lernen</b><span class="leise klein">${plan.wdh.length} Wiederholung${plan.wdh.length === 1 ? '' : 'en'} fällig · ${plan.neu.length} neue Einträge kennenlernen</span></button>
      <button class="modus" id="m-train" ${p.length >= 8 ? '' : 'disabled'}><span class="ic">🎯</span><b>Freies Training</b><span class="leise klein">15 gemischte Aufgaben aus deiner Auswahl</span></button>
      <button class="modus" id="m-sprint" ${p.length >= 8 ? '' : 'disabled'}><span class="ic">⚡</span><b>Sprint · 90 Sekunden</b><span class="leise klein">So viele richtige Antworten wie möglich</span></button>
      <button class="modus" id="m-fehler" ${nf ? '' : 'disabled'}><span class="ic">🔁</span><b>Meine Stolpersteine (${nf})</b><span class="leise klein">Was zuletzt falsch war – sofort noch einmal</span></button>
      <button class="modus" id="m-liste"><span class="ic">📖</span><b>Nachschlagen</b><span class="leise klein">Alle Einträge mit Beispielsatz und Lernstand</span></button>
    </div>
    <div class="einst">
      <label>Themen</label><div class="themen">${Object.keys(THEMEN).map(themenKarte).join('')}</div>
      <div class="legende"><span><i class="s-lernen"></i>im Lernen</span><span><i class="s-fest"></i>gefestigt</span><span><i class="s-sicher"></i>sicher</span><span>grau = noch nicht begegnet</span></div>
      <label>Wortschatz</label><div class="chips">${[1, 2, 3].map(u => `<button class="chip ${E.umfang === u ? 'an' : ''}" data-u="${u}">${UMFANG[u]}</button>`).join('')}</div>
      <label>Nur bestimmte Präpositionen <span class="leise klein">(für Verben, Nomen, Adjektive – nichts gewählt = alle)</span></label>
      <div class="chips">${PRAEPS.map(x => `<button class="chip ${E.praep.includes(x) ? 'an' : ''}" data-p="${x}">${x}</button>`).join('')}</div>
      <p class="leise klein">${p.length} Einträge in deiner Auswahl · ${st.sicher} sicher · ${st.fest} gefestigt · ${st.lernen} im Lernen · ${st.neu} noch neu</p>
    </div></div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; E.themen = E.themen.includes(t) ? E.themen.filter(x => x !== t) : [...E.themen, t]; schreib(EK, E); startbild(); });
  app.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { E.umfang = +b.dataset.u; schreib(EK, E); startbild(); });
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const x = b.dataset.p; E.praep = E.praep.includes(x) ? E.praep.filter(y => y !== x) : [...E.praep, x]; schreib(EK, E); startbild(); });
  document.getElementById('m-lernen').onclick = () => lernen(p);
  document.getElementById('m-train').onclick = () => training(p);
  document.getElementById('m-sprint').onclick = () => sprint(p);
  document.getElementById('m-fehler').onclick = () => lernen(p, fehlerListe(p).slice(0, 15));
  document.getElementById('m-liste').onclick = liste;
  scrollTo(0, 0);
}

/* ---------------- gemeinsame Auswertung einer Aufgabe ---------------- */
function werte(a, ok, d, falsch) {
  aktiv = true;
  const melde = (id, x) => { L.antwort(id, x); bewerte(id, x); if (!x) falsch.set(id, 1); };
  if (a.typ === 'matrix') d.teile.forEach(([tid, x]) => melde(a.items[+tid.split('_').pop()], x));
  else a.items.forEach(id => melde(id, ok));
}

/* ---------------- Begegnung ---------------- */
function begegnung(e) {
  return new Promise(res => {
    const fam = e.t !== 'NVV' && FAMILIEN.find(f => f.some(([w, p]) => w === e.w && p === e.p));
    app.innerHTML = kopf('Neu für dich') + `<div class="karte begegnung aufgabe"><span class="neu">NEU · ${THEMEN[e.t].kurz.toUpperCase()}</span>
      <div class="wort">${e.t === 'NVV' ? `<b>${esc(e.w)}</b>` : `${esc(e.w)} <b>${esc(e.p)}</b> <span class="k-${e.k}" style="font-size:1.1rem">+ ${KASUS[e.k]}</span>`}</div>
      ${e.t === 'NVV' ? `<div class="bed">= ${esc(e.bed)}${e.erg ? ` · mit <b>${esc(e.erg)}</b>` : ''}</div>` : e.x ? `<div class="bed">${esc(e.x)}</div>` : ''}
      <div class="bsp">${fmt(satzVoll(e))}</div>
      ${fam ? `<div class="fam">Wortfamilie: ${fam.map(([w, p, k]) => `${esc(w)} <b>${esc(p)}</b> + ${KASUS[k]}`).join(' · ')}</div>` : ''}
      <p class="leise klein" style="margin-top:14px">Lies den Satz einmal laut. Gleich kommt eine Aufgabe dazu.</p>
      <button class="btn" id="ok" style="min-width:200px">Gemerkt →</button></div>`;
    scrollTo(0, 0);
    document.getElementById('ok').onclick = res;
  });
}

/* ---------------- Heute lernen ---------------- */
async function lernen(p, nurDiese = null) {
  nav.lauf(); aktiv = false;
  const ich = ++lauf, falsch = new Map();
  let schritte;
  if (nurDiese) schritte = nurDiese.map(e => ({ e }));
  else {
    const { wdh, neu, auff } = lernplan(p);
    schritte = mische([...wdh, ...auff]).map(e => ({ e }));
    // Neue Einträge: erst Begegnung, die Aufgabe dazu folgt einige Schritte später
    neu.forEach((e, k) => { const pos = Math.min(schritte.length, k * 3); schritte.splice(pos, 0, { e, neu: true }); schritte.splice(Math.min(schritte.length, pos + 3), 0, { e }); });
  }
  if (!schritte.length) { alert('Heute ist nichts fällig – mach freies Training oder wähle mehr Themen.'); return startbild(); }
  const titel = nurDiese ? 'Stolpersteine' : 'Heute lernen';
  const gesamt = () => schritte.filter(x => !x.neu).length;
  let pt = 0, pa = 0, k = 0; const nochmal = new Set();
  L.beginne(gesamt(), gesamt(), titel);
  for (let i = 0; i < schritte.length; i++) {
    const s = schritte[i];
    if (s.neu) { await begegnung(s.e); if (ich !== lauf) return; continue; }
    const a = aufgabeFuer(s.e); if (!a) continue;
    k++;
    app.innerHTML = kopf(`${titel} · ${k} / ${gesamt()}`) + `<div class="fbalken"><i style="width:${Math.round(100 * i / schritte.length)}%"></i></div><div class="karte" id="feld"></div>`;
    scrollTo(0, 0);
    let richtig = true;
    await zeige(document.getElementById('feld'), a, { onErgebnis: (ok, d) => {
      richtig = ok; if (!s.wieder) { pt += d.p; pa += d.pm; }
      werte(a, ok, d, falsch); L.fortschritt(k, pt, titel, pa);
    } });
    if (ich !== lauf) return;
    // Falsch? Dann kommt der Eintrag in dieser Runde noch einmal (einmalig)
    if (!richtig && !nochmal.has(s.e.id)) { nochmal.add(s.e.id); schritte.splice(Math.min(schritte.length, i + 4), 0, { e: s.e, wieder: true }); }
  }
  aktiv = false; nav.ende();
  const pm = Math.max(pa, 1), pct = await L.ende(pt, pm, { modus: titel });
  ergebnis(`${pt} von ${pm} beim ersten Versuch richtig`, pct, [...falsch.keys()], () => lernen(pool(), nurDiese ? fehlerListe(pool()).slice(0, 15) : null));
}

/* ---------------- Freies Training ---------------- */
async function training(p) {
  nav.lauf(); aktiv = false;
  const ich = ++lauf, falsch = new Map(), benutzt = new Set(), liste = [], mehr = {};
  for (let k = 0; k < 15; k++) {
    let a = zufallsAufgabe(p, { ausser: benutzt.size < p.length - 8 ? benutzt : new Set() });
    if (a && a.items.length > 1 && (mehr[a.art] || 0) >= 1) a = zufallsAufgabe(p, { ausser: benutzt, mehrErlaubt: false });
    if (!a) break; if (a.items.length > 1) mehr[a.art] = 1; a.items.forEach(id => benutzt.add(id)); liste.push(a);
  }
  const pm = liste.reduce((s, a) => s + punkte(a), 0); let pt = 0, pa = 0;
  L.beginne(liste.length, pm, 'Freies Training');
  for (let k = 0; k < liste.length; k++) {
    const a = liste[k];
    app.innerHTML = kopf(`Freies Training · ${k + 1} / ${liste.length}`) + `<div class="fbalken"><i style="width:${Math.round(100 * k / liste.length)}%"></i></div><div class="karte" id="feld"></div>`;
    scrollTo(0, 0);
    await zeige(document.getElementById('feld'), a, { onErgebnis: (ok, d) => { pt += d.p; pa += d.pm; werte(a, ok, d, falsch); L.fortschritt(k + 1, pt, 'Freies Training', pa); } });
    if (ich !== lauf) return;
  }
  aktiv = false; nav.ende();
  const pct = await L.ende(pt, pm, { modus: 'Training' });
  ergebnis(`${pt} von ${pm} Punkten`, pct, [...falsch.keys()], () => training(pool()));
}

function ergebnis(zeile, pct, falsch, nochmal, extra = '') {
  const farbe = pct >= 85 ? 'var(--ok)' : pct >= 60 ? '#5f9e3f' : pct >= 40 ? '#c48a12' : 'var(--fehler)';
  const st = statistik(pool());
  app.innerHTML = kopf('Ergebnis') + `<div class="karte aufgabe" style="text-align:center">
    <div class="ring" style="background:conic-gradient(${farbe} ${pct * 3.6}deg,#e6e6e6 0)"><div style="background:#fff;width:100px;height:100px;border-radius:50%;display:grid;place-items:center">${pct} %</div></div>
    <p><b>${zeile}</b>${extra}</p>
    <p class="leise klein">Dein Lernstand: ${st.sicher} sicher · ${st.fest} gefestigt · ${st.lernen} im Lernen · ${st.faellig} jetzt fällig</p>
    ${falsch.length ? `<h3>Das solltest du dir merken</h3>${falsch.map(id => ITEMS.find(e => e.id === id)).filter(Boolean).map(e => `<div class="merke"><b>${esc(anzeige(e))}</b> – ${fmt(satzVoll(e))}</div>`).join('')}<p class="leise klein">Diese Einträge kommen bald wieder – so lange, bis sie sitzen.</p>` : '<p>Keine Fehler – stark!</p>'}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px">${pct >= 60 ? '<button class="btn" id="zert">🎓 Zertifikat</button>' : ''}<button class="btn" id="nochmal">Weiter üben</button><button class="btn zweit" id="raus">Zum Start</button></div></div>`;
  document.getElementById('nochmal').onclick = nochmal;
  const z = document.getElementById('zert'); if (z) z.onclick = () => L.zertifikat({ titel: 'Präpositionen & Wortverbindungen', zeile: 'Verben, Nomen, Adjektive mit Präposition · Nomen-Verb-Verbindungen', punkte: `${zeile} · ${pct} %` });
  scrollTo(0, 0);
}

/* ---------------- Sprint ---------------- */
function sprint(p) {
  nav.lauf(); aktiv = true;
  const ich = ++lauf, falsch = new Map();
  let ende = Date.now() + 90000, richtig = 0, gesamt = 0, serie = 0;
  L.beginne(0, 0, 'Sprint');
  const naechste = () => {
    if (ich !== lauf) return;
    const a = zufallsAufgabe(p, { schnell: true });
    const opts = mische(a.opts.map((t, j) => ({ t, ok: j === a.l })));
    app.innerHTML = kopf('Sprint') + `<div class="hud"><span class="pk">✔ ${richtig}</span><div class="uhr" id="uhr"></div><span class="pk">${serie >= 3 ? '🔥 ' + serie : '&nbsp;'}</span></div>
      <div class="karte"><div class="kontext">${esc(a.kontext)}</div><div class="sfrage">${fmt(a.frage)}</div>
      <div class="sopts">${opts.map((o, j) => `<button class="sopt" data-j="${j}">${fmt(o.t)}</button>`).join('')}</div><div id="fb" style="min-height:2.4em;margin-top:10px;text-align:center"></div></div>`;
    tick();
    app.querySelectorAll('.sopt').forEach(b => b.onclick = () => {
      if (ich !== lauf) return;
      const o = opts[+b.dataset.j]; gesamt++;
      app.querySelectorAll('.sopt').forEach((x, j) => { x.disabled = true; if (opts[j].ok) x.classList.add('ok'); });
      a.items.forEach(id => { L.antwort(id, o.ok); bewerte(id, o.ok); if (!o.ok) falsch.set(id, 1); });
      if (o.ok) { richtig++; serie++; setTimeout(naechste, 450); }
      else { b.classList.add('nein'); serie = 0; ende -= 3000; document.getElementById('fb').innerHTML = `<span class="leise">${fmt(a.x)}</span> <span style="color:var(--fehler);font-weight:700">−3 s</span>`; setTimeout(naechste, 2800); }
      L.fortschritt(gesamt, richtig, 'Sprint', gesamt);
    });
  };
  const tick = () => { const u = document.getElementById('uhr'); if (!u) return; const rest = Math.max(0, Math.ceil((ende - Date.now()) / 1000)); u.textContent = rest + ' s'; u.classList.toggle('knapp', rest <= 10); };
  const uhr = setInterval(async () => {
    if (ich !== lauf) return clearInterval(uhr);
    tick();
    if (Date.now() >= ende) {
      clearInterval(uhr); lauf++; aktiv = false; nav.ende();
      const pct = await L.ende(richtig, Math.max(gesamt, 1), { modus: 'Sprint', richtig, gesamt });
      const best = lies('ueb_wv_rekord', 0); if (richtig > best) schreib('ueb_wv_rekord', richtig);
      ergebnis(`${richtig} richtige Antworten in 90 Sekunden`, pct, [...falsch.keys()], () => sprint(pool()), `<br>${richtig > best ? '🏆 Neuer Rekord!' : `Dein Rekord: ${best}`}`);
    }
  }, 200);
  naechste();
}

/* ---------------- Nachschlagen ---------------- */
function liste() {
  nav.lauf(); lauf++;
  let q = '', thema = E.themen[0] || 'V', fk = '';
  app.innerHTML = kopf('Nachschlagen') + `<div class="karte">
    <div class="chips">${Object.entries(THEMEN).map(([t, x]) => `<button class="chip" data-th="${t}">${x.icon} ${x.kurz}</button>`).join('')}</div>
    <div id="regel"></div>
    <input class="suche" id="q" placeholder="Suchen …" aria-label="Suchen">
    <div class="chips" id="kf"><button class="chip an" data-k="">alle</button><button class="chip" data-k="A">+ Akk.</button><button class="chip" data-k="D">+ Dat.</button></div>
    <div id="tab"></div></div>`;
  const male = () => {
    app.querySelectorAll('[data-th]').forEach(x => x.classList.toggle('an', x.dataset.th === thema));
    document.getElementById('kf').style.display = thema === 'NVV' ? 'none' : '';
    document.getElementById('regel').innerHTML = thema === 'NVV'
      ? '<p class="leise klein" style="margin:8px 0">Bei Nomen-Verb-Verbindungen trägt das <b>Nomen</b> die Bedeutung, das Verb ist fest. Viele kann man durch ein einfaches Verb ersetzen: eine Entscheidung treffen = entscheiden.</p>'
      : `<div class="regel"><div><b class="k-A">+ Akkusativ</b><br>immer: <b>für, gegen, um</b><br>meist: <b>auf, über</b> · oft: <b>an, in</b></div><div><b class="k-D">+ Dativ</b><br>immer: <b>aus, bei, mit, nach, von, zu</b><br>meist: <b>vor, unter</b> · oft: <b>an</b></div></div>`;
    const ohne = w => w.replace(/^(sich|es|etwas|Geld|der|die|das|eine?n?) /i, '');
    const l = ITEMS.filter(e => e.t === thema && (!fk || e.k === fk) && (!q || (e.w + ' ' + (e.p || '') + ' ' + (e.bed || '')).toLowerCase().includes(q))).sort((a, b) => ohne(a.w).localeCompare(ohne(b.w), 'de'));
    document.getElementById('tab').innerHTML = `<p class="leise klein">${l.length} Einträge · ★★★ = sehr häufig · Zahl = dein Lernstand (0–5)</p><table class="tabelle">${l.map(e => `<tr>
      <td>${e.t === 'NVV' ? `${esc(e.w)}${e.erg ? `<br><span class="leise klein" style="font-weight:400">${esc(e.erg)}</span>` : ''}<br><span class="leise klein" style="font-weight:400">= ${esc(e.bed)}</span>` : `${esc(e.w)} <span class="k-${e.k}">${esc(e.p)} + ${KASUS[e.k]}</span>${e.x ? `<br><span class="leise klein" style="font-weight:400">${esc(e.x)}</span>` : ''}`}</td>
      <td>${fmt(satzVoll(e))}</td><td class="sterne">${sterne(e.h)}<br><span class="stufe" style="background:${STUFENFARBE[stufe(e.id)]}">${stufe(e.id)}</span></td></tr>`).join('')}</table>`;
  };
  document.getElementById('q').oninput = ev => { q = ev.target.value.trim().toLowerCase(); male(); };
  app.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { thema = b.dataset.th; male(); });
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { fk = b.dataset.k; app.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('an', x === b)); male(); });
  male(); scrollTo(0, 0);
}

startbild();
