      '<p style="font-size:.85rem;color:#666">Technische Meldung: ' + msg.replace(/</g, '&lt;') + '</p></div>';
  }
  window.__fehler = zeige;
  addEventListener('error', function (e) { if (!window.__ok) zeige(e.message); });

})();

 { id: 'f4', typ: 'mc', kontext: U, frage: '„Dadurch, dass wir regional einkaufen, sparen wir Transportkosten.“ Das bedeutet:', opts: ['Wir sparen Transportkosten, indem wir regional einkaufen.', 'Wir sparen Transportkosten, damit wir regional einkaufen.', 'Wir sparen Transportkosten, ohne dass wir regional einkaufen.', 'Wir sparen Transportkosten, statt regional einzukaufen.'], l: 0, x: '**dadurch, dass** = **indem** (Mittel, Art und Weise).' },
 { id: 'f5', typ: 'zu', kontext: Z, frage: 'Welche Frage passt zu welchem Konnektor?', paare: [['Wie? Auf welche Weise?', 'indem / dadurch, dass'], ['Wozu? Mit welchem Ziel?', 'damit / um … zu'], ['Was Erwartetes passiert nicht?', 'ohne dass / ohne … zu'], ['Welche Möglichkeit wird nicht gewählt?', 'statt dass / statt … zu']] },
 { id: 'f6', typ: 'bau', kontext: S, frage: 'Kritik an der Konkurrenz: Bilde den Satz.', steine: ['Der Händler hat die Preise erhöht,', 'ohne', 'die Kunden', 'vorher', 'zu', 'informieren.'] },
 { id: 'f7', typ: 'mc', kontext: K, frage: 'Wir schulen unsere Mitarbeiter, ___ die Kunden besser beraten werden.', opts: ['damit', 'um', 'indem', 'ohne'], l: 0, x: 'Anderes Subjekt im Nebensatz (die Kunden) → **damit**, nicht um … zu.' },
 { id: 'f8', typ: 'mc', kontext: K, frage: 'Die Konkurrenz hat ihre Preise gesenkt, ___ die Qualität darunter gelitten hat.', opts: ['ohne dass', 'damit', 'indem', 'um'], l: 0 },
 { id: 'f9', typ: 'bau', kontext: S, frage: 'Das Erfolgsrezept: Bilde den Satz.', steine: ['Wir gewinnen das Vertrauen der Kunden,', 'indem', 'wir', 'Reklamationen', 'schnell', 'bearbeiten.'] },
 { id: 'f10', typ: 'mc', kontext: U, frage: 'Welcher Satz ist **falsch**?', opts: ['Wir bestellen früher, um die Kunden nicht warten zu lassen.', 'Wir bestellen früher, damit die Kunden nicht warten müssen.', 'Wir bestellen früher, um die Kunden nicht warten müssen.', 'Wir bestellen früher, damit wir die Kunden nicht warten lassen.'], l: 2, x: 'Nach **um** braucht man **zu** + Infinitiv: *um … warten **zu lassen***.' }
]};
const PRO_STATION = 6;
const RAENGE = [[90, 'Handelsprofi', '🏆'], [75, 'Filialleitung', '🥇'], [60, 'Kaufmann / Kauffrau', '🥈'], [40, 'Azubi im 2. Jahr', '🥉'], [0, 'Lehrling', '📦']];

/* ======================= SPIEL ======================= */
const app = document.getElementById('app');
const L = await starte('handel-kontor');
if (!L.frei) { L.sperre(app); throw new Error('gesperrt'); }
const labels = {}; Object.values(POOL).flat().forEach(a => labels[a.id] = label(a)); L.registriereItems(labels);

let G;
const nav = navigation(L, { zurueck: () => startbild(), fortschritt: () => !!(G && G.erledigt > 0) });
app.addEventListener('click', e => { if (e.target.closest('#raus')) nav.zurStart(); });
const euro = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('de-DE') + ' €';

function startbild() {
  app.innerHTML = `<div class="karte start" style="margin-top:18px">
    <div class="schild">FÖRDE-HANDEL · KIEL · SEIT 1923</div>
    <h1>Das Handelskontor</h1>
    <p>Du übernimmst das kleine Handelskontor am Hafen. Ein großer Kunde, das <b>Möbelhaus Nord</b>, will 40 Bürostühle. Begleite den Auftrag durch alle <b>sechs Stationen</b> – von der Anfrage bis zum Chefgespräch.</p>
    <div class="regeln"><div><b>+100 €</b>für jede richtige Antwort</div><div><b>⭐ Bonus</b>für Antworten in Serie (bis +100 €)</div><div><b>−50 €</b>Retoure bei Fehlern – die Aufgabe kommt als Nachlieferung zurück</div></div>
    <p class="leise klein">36 Aufgaben · Wortschatz Handel · indem, damit, um … zu, ohne dass, statt … zu</p>
    <div class="knopfreihe"><button class="btn zweit" id="spick">📒 Spickzettel</button><button class="btn" id="los" style="min-width:200px">Kontor öffnen →</button></div></div>`;
  document.getElementById('los').onclick = neuesSpiel;
  document.getElementById('spick').onclick = spickzettel;
}

function neuesSpiel() {
  nav.lauf();
  G = { st: 0, umsatz: 0, serie: 0, richtig: 0, erledigt: 0, gesamt: STATIONEN.length * PRO_STATION, stationsUmsatz: [], fehlerJeTyp: {}, typZahl: {} };
  G.plan = STATIONEN.map(s => ziehe(POOL[s.k], PRO_STATION));
  L.beginne(G.gesamt, G.gesamt, 'Station 1: ' + STATIONEN[0].name);
  stationsStart();
}

function hud() {
  const s = Math.min(5, G.serie);
  return `<div class="hud"><button class="btn zweit klein" id="raus" title="Zurück zum Start">←<span class="lang"> Start</span></button><div class="kasse" id="kasse">${euro(G.umsatz)}</div>
    <div class="sterne" title="Serie">${'★'.repeat(s)}<span style="color:#ccc">${'★'.repeat(5 - s)}</span></div>
    <button class="btn zweit klein" id="spick">📒</button></div>
    <div class="weg">${STATIONEN.map((s, i) => `<div class="stn ${i < G.st ? 'fertig' : i === G.st ? 'jetzt' : ''}"><div class="p">${i < G.st ? '✓' : s.icon}</div><span>${s.name}</span></div>`).join('')}</div>`;
}

function stationsStart() {
  const s = STATIONEN[G.st];
  app.innerHTML = hud() + `<div class="karte auftrag aufgabe"><div class="kontext">Station ${G.st + 1} von 6</div>
    <h2>${s.icon} ${s.name}</h2><p>${s.auftrag}</p><button class="btn weiter" id="go">Los geht's →</button></div>`;
  document.getElementById('spick').onclick = spickzettel;
  document.getElementById('go').onclick = () => { G.q = G.plan[G.st].slice(); G.nach = []; G.stU = 0; G.inSt = 0; naechste(); };
  L.fortschritt(G.erledigt, G.richtig, 'Station ' + (G.st + 1) + ': ' + s.name);
}

async function naechste() {
  const s = STATIONEN[G.st];
  if (G.q.length) {
    const a = G.q.shift(); G.inSt++;
    app.innerHTML = hud() + `<div class="zaehl">${s.icon} ${s.name} · Aufgabe ${G.inSt} von ${PRO_STATION}</div><div class="karte" id="feld"></div>`;
    document.getElementById('spick').onclick = spickzettel;
    await zeige(document.getElementById('feld'), a, { onErgebnis: ok => wertung(a, ok) });
    return naechste();
  }
  if (G.nach.length) {
    const a = G.nach.shift();
    app.innerHTML = hud() + `<div class="nachl">🔁 <b>Nachlieferung:</b> Diese Aufgabe war vorhin schwierig. Versuch es noch einmal – ohne Punkte, nur zum Üben.</div><div class="karte" id="feld"></div>`;
    document.getElementById('spick').onclick = spickzettel;
    await zeige(document.getElementById('feld'), a, { lobText: 'Jetzt sitzt es!', fehlerText: 'Noch nicht – schau dir die Lösung genau an.' });
    return naechste();
  }
  G.stationsUmsatz.push(G.stU); G.st++;
  if (G.st < STATIONEN.length) zwischenbilanz(); else ende();
}

function wertung(a, ok) {
  L.antwort(a.id, ok); G.erledigt++;
  G.typZahl[a.kontext] = (G.typZahl[a.kontext] || 0) + 1;
  let d;
  if (ok) { G.richtig++; G.serie++; d = 100 + Math.min(5, G.serie - 1) * 20; }
  else { G.serie = 0; d = -50; G.nach.push(a); G.fehlerJeTyp[a.kontext] = (G.fehlerJeTyp[a.kontext] || 0) + 1; }
  G.umsatz += d; G.stU += d;
  const k = document.getElementById('kasse');
  if (k) { k.textContent = euro(G.umsatz); k.classList.remove('plus', 'minus'); void k.offsetWidth; k.classList.add(d > 0 ? 'plus' : 'minus'); }
  const st = document.querySelector('.sterne'); if (st) { const s = Math.min(5, G.serie); st.innerHTML = '★'.repeat(s) + `<span style="color:#ccc">${'★'.repeat(5 - s)}</span>`; }
  L.fortschritt(G.erledigt, G.richtig, 'Station ' + (G.st + 1) + ': ' + STATIONEN[G.st].name);
}

function zwischenbilanz() {
  const alt = STATIONEN[G.st - 1], u = G.stationsUmsatz.at(-1);
  app.innerHTML = hud() + `<div class="karte aufgabe" style="text-align:center"><div style="font-size:2.4rem">${u >= 400 ? '📈' : u >= 0 ? '📊' : '📉'}</div>
    <h2>Station „${alt.name}“ abgeschlossen</h2><p>Umsatz dieser Station: <b style="color:${u >= 0 ? 'var(--ok)' : 'var(--fehler)'}">${u >= 0 ? '+' : ''}${euro(u)}</b></p>
    <p class="leise">Weiter geht es mit <b>${STATIONEN[G.st].icon} ${STATIONEN[G.st].name}</b>.</p>
    <button class="btn weiter" id="go">Weiter →</button></div>`;
  document.getElementById('spick').onclick = spickzettel;
  document.getElementById('go').onclick = stationsStart;
}

async function ende() {
  nav.ende();
  const pct = await L.ende(G.richtig, G.gesamt, { umsatz: G.umsatz });
  const r = RAENGE.find(x => pct >= x[0]);
  const schwach = Object.entries(G.fehlerJeTyp).sort((a, b) => b[1] - a[1])[0];
  app.innerHTML = hud() + `<div class="karte aufgabe" style="text-align:center">
    <div style="font-size:3rem">${r[2]}</div><div class="leise">Dein neuer Titel</div><div class="rang">${r[1]}</div>
    <div class="bilanz">${STATIONEN.map((s, i) => `<div><span>${s.icon} ${s.name}</span><span>${euro(G.stationsUmsatz[i])}</span></div>`).join('')}
      <div class="summe"><span>Jahresumsatz</span><span>${euro(G.umsatz)}</span></div></div>
    <p><b>${G.richtig} von ${G.gesamt}</b> Aufgaben beim ersten Versuch richtig (${pct} %).</p>
    ${schwach ? `<p class="leise">Am meisten Fehler bei: <b>${esc(schwach[0])}</b> – ein Blick in den Spickzettel lohnt sich.</p>` : '<p>Keine einzige Retoure – ausgezeichnet!</p>'}
    <div class="knopfreihe">${pct >= 60 ? '<button class="btn" id="zert">🎓 Zertifikat herunterladen</button>' : ''}<button class="btn zweit" id="nochmal">Neuer Auftrag</button><a class="btn zweit" href="index.html">Zur Zentrale</a></div>
    ${pct < 60 ? '<p class="leise klein">Ab 60 % gibt es ein Zertifikat. Die Aufgaben werden jedes Mal neu gemischt.</p>' : ''}</div>`;
  document.getElementById('spick').onclick = spickzettel;
  document.getElementById('nochmal').onclick = neuesSpiel;
  const z = document.getElementById('zert');
  if (z) z.onclick = () => L.zertifikat({ titel: 'Das Handelskontor', zeile: 'Wortschatz Handel · indem, damit, ohne dass, statt … zu', punkte: `${r[1]} · ${G.richtig}/${G.gesamt} richtig · Umsatz ${euro(G.umsatz)}` });
}

function spickzettel() {
  const d = document.createElement('div'); d.className = 'spick';
  d.innerHTML = `<div class="karte"><div class="zeile" style="justify-content:space-between"><h2 style="margin:0">📒 Spickzettel</h2><button class="btn zweit klein" id="zu">Schließen</button></div>
  <h3 style="margin-top:14px">Konnektoren</h3>
  <table><tr><th>Frage</th><th>Konnektor</th><th>Beispiel</th></tr>
  <tr><td>Wie? Wodurch?</td><td><b>indem</b><br><span class="leise klein">= dadurch, dass</span></td><td>Wir sparen Geld, <b>indem</b> wir Skonto <u>nutzen</u>.</td></tr>
  <tr><td>Wozu?</td><td><b>damit</b></td><td>Wir liefern schnell, <b>damit</b> der Kunde zufrieden <u>ist</u>.</td></tr>
  <tr><td></td><td><b>um … zu</b></td><td>Wir liefern schnell, <b>um</b> den Kunden <b>zu</b> <u>halten</u>.</td></tr>
  <tr><td>Was passiert nicht (obwohl erwartet)?</td><td><b>ohne dass</b></td><td>Er hat bestellt, <b>ohne dass</b> der Chef es <u>wusste</u>.</td></tr>
  <tr><td></td><td><b>ohne … zu</b></td><td>Er hat bestellt, <b>ohne</b> den Preis <b>zu</b> <u>prüfen</u>.</td></tr>
  <tr><td>Welche Alternative passiert nicht?</td><td><b>statt … zu</b> / <b>statt dass</b></td><td><b>Statt</b> an<b>zu</b>rufen, schreibt er eine E-Mail.</td></tr></table>
  <h3 style="margin-top:14px">Die wichtigste Regel</h3>
  <p><b>um … zu</b>, <b>ohne … zu</b>, <b>statt … zu</b> nur, wenn beide Satzteile <b>dasselbe Subjekt</b> haben.<br>Verschiedene Subjekte → <b>damit</b>, <b>ohne dass</b>, <b>statt dass</b>.<br><b>indem</b> hat nie „zu“.</p>
  <p class="leise klein">Im Nebensatz steht das konjugierte Verb am Ende. Bei trennbaren Verben steht „zu“ in der Mitte: an<b>zu</b>rufen, ein<b>zu</b>kaufen.</p>
  <h3 style="margin-top:14px">Wichtige Wortverbindungen</h3>
  <p class="klein">ein Angebot einholen / machen · eine Bestellung aufgeben · einen Auftrag erteilen · einen Termin einhalten · eine Rechnung begleichen · eine Frist setzen · Mängel beheben · eine Reklamation bearbeiten · Rabatt gewähren · Skonto abziehen</p></div>`;
  document.body.append(d);
  nav.fenster(d);
}

startbild();
</script>
</body>
</html>
