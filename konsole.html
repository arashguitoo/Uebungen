<style>

  body{font-size:16px}
  .top{background:#1f2328;color:#fff}

  .leiste label{font-size:.9rem;color:var(--leise)}
  .live{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

  .lk .n{font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px}
  .balken{height:9px;background:#eee;border-radius:9px;overflow:hidden}
  .balken i{display:block;height:100%;background:var(--ok)}
  .st{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}

  .puls{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e9e5b;margin-right:4px;animation:p 1.4s infinite}

  .q{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linie)}
  .q .pz{font-weight:700;text-align:right}
  .q .lb{font-size:.9rem}
  .q .bb{height:6px;background:#eee;border-radius:6px;margin-top:4px;overflow:hidden}

  .code{font-family:Consolas,monospace;font-weight:700;letter-spacing:.12em;background:#f3f1ec;padding:2px 8px;border-radius:6px}
  .exk{background:#fff;border:1px solid var(--linie);border-radius:12px;padding:14px;display:grid;gap:8px}
  .exk .kopfz{display:flex;gap:10px;align-items:center}

  .schalter{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.95rem}

  .meldung{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:var(--schatten)}
  /* Feedback */
  .fbchips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--linie);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:.88rem;cursor:pointer}
  .chip.an{background:#1f2328;color:#fff;border-color:#1f2328}
  .fbm th{font-size:.72rem;text-transform:none;letter-spacing:0;max-width:120px;line-height:1.2}
  .fbz{cursor:pointer;text-align:center}.fbz:hover{background:#f6f3ec}
  .fbw{display:inline-block;min-width:34px;text-align:center;border-radius:7px;padding:3px 7px;font-weight:700;font-size:.85rem}
  .fbw.leer{color:#bbb;background:#f6f6f6}
  .sw{font-size:.72rem;color:#5b4fa3;font-weight:600}
  td.alt{color:#c0392b;font-weight:700}
  .namebtn{background:none;border:0;font:inherit;font-weight:700;cursor:pointer;padding:0;text-align:left;color:inherit;text-decoration:underline dotted}
  .fbmenue{position:absolute;z-index:50;background:#fff;border:1px solid var(--linie);border-radius:10px;box-shadow:var(--schatten);padding:6px;display:grid;gap:4px;min-width:190px}
  .fbmenue button{font:inherit;font-size:.9rem;font-weight:600;border:1px solid transparent;border-radius:7px;padding:6px 10px;text-align:left;cursor:pointer;background:#f4f4f4}
  .fbmenue button.an{outline:2px solid #1f2328}
  .fbkopf .mini{display:grid;gap:2px;min-width:110px}.fbkopf .mini .balken{width:110px}
  .teilen{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border-radius:10px;background:#f6f3ec}

  .fbnote{grid-column:1/-1;font-size:.85rem;padding:5px 8px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--linie);background:#fff;border-radius:7px;padding:4px 8px;cursor:pointer;min-width:34px}
  .mkg{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:5px 0;align-items:start}
  @media(max-width:620px){.mkg{grid-template-columns:1fr}}
  .mk{font:inherit;font-size:.85rem;border:1px solid var(--linie);background:#fff;border-radius:99px;padding:3px 10px;margin:2px;cursor:pointer}
  .mk.s{background:#d9f2e2;border-color:#2e9e5b;color:#1d7a45;font-weight:700}.mk.s::before{content:'＋ '}
  .mk.w{background:#fbe0db;border-color:#d9483b;color:#b3402f;font-weight:700}.mk.w::before{content:'→ '}
  span.mk{cursor:default}
  .fbtexte{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  @media(max-width:700px){.fbtexte{grid-template-columns:1fr}}
  .fbtexte label{font-size:.9rem;font-weight:600;display:grid;gap:4px}.fbtexte textarea{min-height:90px;font-weight:400}
  .fblog{max-height:320px;overflow:auto;margin-top:8px;display:grid;gap:4px;font-size:.9rem}
  .fblog .notiz{background:#fff8e1;border-radius:6px;padding:3px 6px}
  select.frei{background:#e3f6ea}select.gesperrt{background:#fbe0db}
  .pill{display:inline-block;border-radius:99px;padding:1px 9px;font-weight:700;font-size:.78rem;white-space:nowrap}
  .dteile{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
  .dteile>div{background:#f8f6f2;border-radius:10px;padding:10px 12px;display:grid;gap:3px}
  .dges b{font-size:1.6rem}
  .dempf{border-left:4px solid #d9483b;background:#fdf6f4;border-radius:8px;padding:7px 10px;margin-bottom:6px;display:grid;gap:2px}
  .diag h4{font-size:.95rem}
  .tabzahl{display:inline-block;background:#ffd166;color:#1f2328;border-radius:99px;font-size:.75rem;padding:0 7px;margin-left:4px}
  .korrgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
  @media(max-width:900px){.korrgrid{grid-template-columns:1fr}}
  .kseite{display:grid;gap:12px}
  .ktext{white-space:pre-wrap;line-height:1.9;font-size:1.02rem;background:#fffdf8;border:1px solid #ece4d4;border-radius:10px;padding:14px 16px}
  .km{border-bottom:2px solid var(--kc);background:color-mix(in srgb,var(--kc) 12%,transparent);border-radius:3px;cursor:pointer}
  .km::after{content:attr(data-n);font-size:.65rem;font-weight:700;color:var(--kc);vertical-align:super;margin-left:1px}
  .km.null::before{content:'‸';color:var(--kc);font-weight:700}
  .klist{display:grid;gap:6px;margin-top:8px;max-height:520px;overflow:auto}
  .kitem{border:1px solid #ece6dc;border-left:4px solid var(--kc);border-radius:8px;padding:6px 8px;background:#fff}
  .kitem.aus{opacity:.5}
  .kitem .n{font-weight:700;color:var(--kc);font-size:.85rem}
  .kitem.blink{box-shadow:0 0 0 3px #ffd166}

  .kpop input{min-height:36px;padding:5px 8px}
</style>

<div id="demo"></div>
<header class="top"><div class="wrap">
  <h1>Konsole · Übungszentrale</h1>
  <span id="wer" class="klein" style="opacity:.8"></span>
  <button class="btn zweit klein versteckt" id="aus" style="background:transparent;color:#fff;border-color:#666">Abmelden</button>
  <nav class="tabs versteckt" id="tabs">
    <button class="tab an" data-t="live">● Live</button>
    <button class="tab" data-t="erg">Ergebnisse</button>
    <button class="tab" data-t="kurse">Kurse &amp; Codes</button>
    <button class="tab" data-t="ex">Übungen</button>
    <button class="tab" data-t="fb">👤 Feedback &amp; Freigaben</button>
    <button class="tab" data-t="tx">✍️ Texte <span id="txZahl" class="tabzahl"></span></button>
    <a href="live-studio.html" style="color:#ffd166;font-weight:700;padding:10px 16px;text-decoration:none;white-space:nowrap" title="Live-Umfragen und Live-Quiz für den Unterricht starten">📡 Live im Unterricht</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* Wächter: zeigt eine verständliche Meldung statt einer leeren Seite */
window.__ok = false;
(function () {
  function zeige(msg) {
    msg = String(msg || 'unbekannter Fehler');
    var fb = /firebase|gstatic/i.test(msg);
    var ziel = document.getElementById('app') || document.body;
    ziel.innerHTML = '<div class="karte" style="max-width:580px;margin:40px auto;border-color:#f1c6be;background:#fbe9e6">' +
      '<h2>Die Seite konnte nicht geladen werden</h2>' +
      (fb ? '<p>Die Verbindung zu Firebase hat nicht geklappt. Bitte prüfe die Internetverbindung und schalte einen Werbeblocker für diese Seite aus.</p>'
          : '<p>Bitte lade die Seite einmal komplett neu: Windows <b>Strg + F5</b>, Mac <b>Cmd + Shift + R</b>. Wenn das nicht hilft: Sind wirklich alle Dateien des Ordners hochgeladen?</p>') +
      '<p style="font-size:.85rem;color:#666">Technische Meldung: ' + msg.replace(/</g, '&lt;') + '</p></div>';
  }
  window.__fehler = zeige;
  addEventListener('error', function (e) { if (!window.__ok) zeige(e.message); });
  addEventListener('unhandledrejection', function (e) { var m = e.reason && e.reason.message || e.reason; if (!window.__ok || /firebase|gstatic/i.test(String(m))) zeige(m); });
  setTimeout(function () { if (!window.__ok) zeige('Die Programmdateien wurden nicht vollständig geladen.'); }, 12000);
})();
</script>
<script type="module">
window.__ok = true;
import { db, DEMO, zufall, esc, mitDemo } from './db.js?v=20261028a';
import { KATALOG, exById } from './katalog.js?v=20261028a';
import { rubriken, rubrikVon } from './rubriken.js?v=20261028a';
import { AUFGABEN as SW_AUF, ARTEN as SW_ARTEN, analysiere as SW_analysiere, ltKategorie as SW_ltKat, vorschlag as SW_vorschlag, KAT as SW_KAT, KRITERIEN as SW_KRIT, STUFE as SW_STUFE, wortzahl as SW_wortzahl } from './schreib-daten.js?v=20261028a';
import { LISTEN, SKALEN, MERKMALE, MERKMAL, skalaVon, wertInfo, prozent } from './feedback-kriterien.js?v=20261028a';
import { TEST as DTEST, BEREICHE as DBER, analyse as dAnalyse, AUFGABEN as DAUFG } from './diagnose-daten.js?v=20261028a';

if (DEMO) document.getElementById('demo').innerHTML = '<div class="demo-band">DEMO-MODUS – Anmeldung mit beliebigen Daten, alles bleibt in diesem Browser</div>';
const $ = s => document.querySelector(s), app = $('#app');
const D = { kurse: {}, pub: {}, live: {}, res: {}, items: {}, wieder: {}, fb: {}, mein: {}, selbst: {}, abgaben: {} };
let tab = 'live', offs = [], gewKurs = null;
const F = { fbKurs: null, fbListe: 't1a', fbPid: null, werk: 'alle', lkurs: 'alle', lex: 'alle', nurAktiv: false, ekurs: 'alle', eex: 'alle', mehr: false };
const BASE = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
// Sicherheitsnetz: ein leerer Code oder Kurs darf nie zu „codes/“ oder „kurse/“ werden (das wäre der ganze Knoten)
const sicher = up => { for (const k of Object.keys(up)) if (/(^|\/)(undefined|null)?(\/|$)/.test(k) || /\/$/.test(k) || /^(codes|kurse|pub\/kurse|fb|mein|selbst)$/.test(k)) { console.warn('Blockiert:', k); delete up[k]; } return up; };
const meld = t => { const m = document.createElement('div'); m.className = 'meldung'; m.textContent = t; document.body.append(m); setTimeout(() => m.remove(), 2200); };
const zeit = t => t ? new Date(t).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const dauer = s => s >= 3600 ? Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' min';
const vor = t => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? 'vor ' + s + ' s' : s < 3600 ? 'vor ' + Math.floor(s / 60) + ' min' : s < 86400 ? 'vor ' + Math.floor(s / 3600) + ' h' : zeit(t); };
const farbe = p => p >= 85 ? '#d9f2e2' : p >= 65 ? '#eef6d5' : p >= 45 ? '#fdf0cf' : '#fbe0db';
const exName = id => (exById(id) || { titel: id }).titel;
const qKurz = e => e && e.quelle ? `${e.quelle.werk}${e.quelle.lektion ? ' ' + (typeof e.quelle.lektion === 'number' ? 'L' + e.quelle.lektion : e.quelle.lektion.replace('Haltestelle ', 'HS ')) : ''}` : '';
const qBadge = e => e && e.quelle ? `<span class="quelle" title="Nur in der Konsole sichtbar">📚 ${esc(e.quelle.werk)}${e.quelle.lektion ? ' · ' + (typeof e.quelle.lektion === 'number' ? 'Lektion ' : '') + esc(e.quelle.lektion) : ''}</span>` : '';
const werke = () => [...new Set(KATALOG.filter(e => e.quelle).map(e => e.quelle.werk))];
const kursName = kid => (D.kurse[kid] || {}).name || (kid ? '(gelöschter Kurs)' : 'Gast');
const kursListe = () => Object.entries(D.kurse || {}).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));

/* ---------------- Anmeldung ---------------- */
let angemeldet = false;
db.onAuth((u, admin, err) => {
  offs.forEach(f => f()); offs = []; angemeldet = !!(u && admin);
  if (err) { window.__fehler('Firebase: ' + (err.message || err)); return; }
  if (!u || !admin) {
    $('#tabs').classList.add('versteckt'); $('#aus').classList.add('versteckt'); $('#wer').textContent = '';
    app.innerHTML = `<form class="karte" id="login" style="max-width:420px;margin:50px auto">
      <h2>Anmelden</h2><p class="leise">Dieselben Zugangsdaten wie in der Liga-Konsole.</p>
      ${u && !admin ? '<p class="hinweis">Dieses Konto hat keinen Zugriff.</p>' : ''}
      <input type="email" id="em" placeholder="E-Mail" style="width:100%;margin-bottom:10px" autocomplete="username" required>
      <input type="password" id="pw" placeholder="Passwort" style="width:100%;margin-bottom:12px" autocomplete="current-password" required>
      <button class="btn" style="width:100%">Anmelden</button><p id="lf" style="color:var(--fehler)"></p></form>`;
    $('#login').onsubmit = async e => { e.preventDefault(); $('#lf').textContent = '';
      try { await db.login($('#em').value, $('#pw').value); } catch (err) { $('#lf').textContent = 'Anmeldung fehlgeschlagen: ' + (err.code || err.message); } };
    return;
  }
  $('#tabs').classList.remove('versteckt'); $('#aus').classList.remove('versteckt');
  $('#wer').textContent = DEMO ? 'Demo' : (u.email || '');
  for (const k of Object.keys(D)) offs.push(db.listen(k, v => { D[k] = v || {}; zeichne(k); }, e => { if (document.getElementById('ladefehler')) return; const b = document.createElement('div'); b.id = 'ladefehler'; b.className = 'hinweis'; b.style.cssText = 'margin:12px auto;max-width:900px;border-color:#f1c6be;background:#fbe9e6'; b.innerHTML = '<b>Die Daten konnten nicht geladen werden</b> (' + esc(k) + ': ' + esc(e.code || e.message) + '). Deine Kurse und Codes sind deshalb nicht sichtbar – das heißt nicht, dass sie gelöscht sind. Meist liegt es an den Datenbankregeln.'; app.before(b); }));
  zeichne();
});
$('#aus').onclick = () => db.logout();
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('an', x === b)); tab = b.dataset.t; zeichne();
});
setInterval(() => { if (angemeldet && tab === 'live' && !document.querySelector('#app input:focus,#app select:focus')) zeichne('tick'); }, 5000);

let zTimer = null;
let syncT = null;
function syncAlle() { clearTimeout(syncT); syncT = setTimeout(() => { for (const [kid, k] of Object.entries(D.kurse || {})) for (const [pid, p] of Object.entries(k.tn || {})) if (p.code && meinOf(p.code).fb) syncPub(kid, pid, p.code); }, 2500); }
function zeichne(quelle) {
  // Formulare nicht beim Tippen überschreiben
  if (quelle && document.activeElement && document.activeElement.closest('#app') && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    clearTimeout(zTimer); zTimer = setTimeout(() => zeichne(), 1500); return;
  }
  if (quelle === 'res' || quelle === 'fb') syncAlle();
  if (tab === 'live') live(); else if (tab === 'erg') erg(); else if (tab === 'kurse') kurse(); else if (tab === 'fb') feedback(); else if (tab === 'tx') texteTab(); else uebungen();
  const tz = document.getElementById('txZahl'); if (tz) { const n = offeneAbgaben(); tz.textContent = n || ''; tz.style.display = n ? '' : 'none'; }
}

/* ---------------- LIVE ---------------- */
function status(v) { if (v.st === 'fertig') return 'fertig'; if (v.st === 'abgebrochen') return 'abgebrochen'; return Date.now() - v.t < 60000 ? 'aktiv' : 'inaktiv'; }
const ST = { aktiv: '<span class="puls"></span>spielt gerade', fertig: 'fertig', abgebrochen: 'verlassen', inaktiv: 'keine Aktivität' };
function kursOptionen(wert, mitGast = true) {
  return `<option value="alle">Alle Kurse</option>${mitGast ? `<option value="gast" ${wert === 'gast' ? 'selected' : ''}>Ohne Code (Gäste)</option>` : ''}` +
    kursListe().map(([k, v]) => `<option value="${k}" ${wert === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
}
const exOptionen = wert => `<option value="alle">Alle Übungen</option>` + KATALOG.map(e => `<option value="${e.id}" ${wert === e.id ? 'selected' : ''}>${esc(e.titel)}${qKurz(e) ? ' [' + esc(qKurz(e)) + ']' : ''}</option>`).join('');
const passtKurs = (kid, f) => f === 'alle' || (f === 'gast' ? !kid : kid === f);

function live() {
  const alle = Object.entries(D.live || {}).map(([sid, v]) => ({ sid, ...v, s: status(v) }));
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  let l = alle.filter(v => passtKurs(v.kid, F.lkurs) && (F.lex === 'alle' || v.ex === F.lex) && (!F.nurAktiv || v.s === 'aktiv'));
  l.sort((a, b) => ((b.s === 'aktiv') - (a.s === 'aktiv')) || (b.t - a.t));

/* ---------------- ERGEBNISSE ---------------- */
function versuche() {
  const out = [];
  for (const [ex, m] of Object.entries(D.res || {})) for (const [sid, r] of Object.entries(m || {})) out.push({ ex, sid, ...r });
  return out.sort((a, b) => b.t - a.t);
}
const teilVon = v => { try { return v.x ? (JSON.parse(v.x).teil || '') : ''; } catch (e) { return ''; } };
const median = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function erg() {
  const alle = versuche();
  const l = alle.filter(v => passtKurs(v.kid, F.ekurs) && (F.eex === 'alle' || v.ex === F.eex));
  const pcts = l.map(v => v.pct || 0), personen = new Set(l.map(v => v.pid || ('g:' + v.name)));
  let h = `<div class="leiste"><select id="ek">${kursOptionen(F.ekurs)}</select><select id="ee">${exOptionen(F.eex)}</select>
    <span style="flex:1"></span><button class="btn zweit klein" id="csv">⤓ CSV-Export</button></div>
    <div class="zahlen"><div class="zahl"><b>${l.length}</b><span>Durchgänge</span></div>
    <div class="zahl"><b>${personen.size}</b><span>Personen</span></div>
    <div class="zahl"><b>${l.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / l.length) : 0} %</b><span>Durchschnitt</span></div>
    <div class="zahl"><b>${Math.round(median(pcts))} %</b><span>Median</span></div>
    <div class="zahl"><b>${l.length ? dauer(Math.round(median(l.map(v => v.dur || 0)))) : '–'}</b><span>Bearbeitungszeit (Median)</span></div></div>`;

  // Matrix für einen Kurs
  if (F.ekurs !== 'alle' && F.ekurs !== 'gast' && D.kurse[F.ekurs]) {
    const tn = Object.entries(D.kurse[F.ekurs].tn || {}).sort((a, b) => a[1].name.localeCompare(b[1].name));
    const zug = (D.pub.kurse && D.pub.kurse[F.ekurs] && D.pub.kurse[F.ekurs].ex) || {};
    const exs = KATALOG.filter(e => (F.eex === 'alle' || e.id === F.eex) && (zug[e.id] || l.some(v => v.ex === e.id)));
    h += `<h2 style="margin-top:20px">Übersicht ${esc(D.kurse[F.ekurs].name)}</h2><p class="leise klein">Bestes Ergebnis je Person (Anzahl Durchgänge in Klammern). Bei Trainings mit mehreren Teilen: Durchschnitt der besten Ergebnisse je Teil – Maus auf die Zelle zeigt die Teile.</p>`;
    h += exs.length && tn.length ? `<div class="tabwrap"><table class="t"><tr><th>Name</th>${exs.map(e => `<th>${esc(e.titel)}${qKurz(e) ? '<br><span class="quelle">' + esc(qKurz(e)) + '</span>' : ''}</th>`).join('')}</tr>${tn.map(([pid, p]) => `<tr><td><b>${esc(p.name)}</b></td>${exs.map(e => {
      const vs = l.filter(v => v.pid === pid && v.ex === e.id); if (!vs.length) return '<td class="leise">–</td>';
      if (e.teile) { const best = {}; vs.forEach(v => { const t = teilVon(v) || '?'; best[t] = Math.max(best[t] ?? 0, v.pct || 0); });
        const tt = Object.entries(best).filter(([t]) => t !== 'Prüfungsmix'), d = tt.length ? Math.round(tt.reduce((s, [, x]) => s + x, 0) / tt.length) : (best['Prüfungsmix'] ?? 0);
        return `<td title="${esc(Object.entries(best).map(([t, x]) => t + ': ' + x + ' %').join('\n'))}"><span class="zelle" style="background:${farbe(d)}">${d} %</span> <span class="klein leise">${tt.length}/${e.teile} Teile</span></td>`; }
      const b = Math.max(...vs.map(v => v.pct || 0)); return `<td><span class="zelle" style="background:${farbe(b)}">${b} %</span> <span class="klein leise">(${vs.length})</span></td>`; }).join('')}</tr>`).join('')}</table></div>`
      : '<p class="leise">Noch keine Teilnehmenden oder zugewiesenen Übungen.</p>';
  }

  // Aufgabenanalyse
  if (F.eex !== 'alle') {
    const stat = {}, txt = D.items[F.eex] || {};
    l.forEach(v => Object.entries(v.it || {}).forEach(([k, x]) => { stat[k] = stat[k] || [0, 0]; stat[k][0] += x ? 1 : 0; stat[k][1]++; }));
    const rows = Object.entries(stat).map(([k, [r, n]]) => ({ k, q: Math.round(100 * r / n), n })).sort((a, b) => a.q - b.q);
    h += `<h2 style="margin-top:24px">Aufgabenanalyse · ${esc(exName(F.eex))}</h2><p class="leise klein">Lösungsquote beim ersten Versuch – die schwierigsten Aufgaben stehen oben.</p>
      <div class="karte">${rows.length ? rows.map(r => `<div class="q"><div class="pz" style="color:${r.q < 50 ? 'var(--fehler)' : r.q < 75 ? '#a06a00' : 'var(--ok)'}">${r.q} %</div>

  // Liste der Durchgänge

    ${zeig.map(v => `<tr><td>${zeit(v.t)}</td><td><b>${esc(v.name)}</b></td><td>${esc(v.kid ? kursName(v.kid) : 'Gast')}</td><td>${esc(exName(v.ex))}${teilVon(v) ? `<br><span class="klein leise">${esc(teilVon(v))}</span>` : ''}</td>
    <td>${v.p} / ${v.pm}</td><td><span class="zelle" style="background:${farbe(v.pct)}">${v.pct} %</span></td><td>${dauer(v.dur || 0)}</td>
    <td><button class="icon" title="Durchgang löschen" data-del="${v.ex}/${v.sid}">🗑</button></td></tr>`).join('')}</table></div>
    ${l.length > zeig.length ? `<button class="btn zweit klein" id="mehr" style="margin-top:10px">Alle ${l.length} anzeigen</button>` : ''}` : '<p class="leise">Noch keine Ergebnisse.</p>');
  app.innerHTML = h;

  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Diesen Durchgang endgültig löschen?')) { await db.remove('res/' + b.dataset.del); meld('Gelöscht.'); } });
  $('#csv').onclick = () => {
    const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
    const z = [['Datum', 'Name', 'Kurs', 'Code', 'Übung', 'Teil', 'Richtig', 'Maximum', 'Prozent', 'Dauer (s)'].map(q).join(';')];
    l.forEach(v => z.push([new Date(v.t).toLocaleString('de-DE'), v.name, v.kid ? kursName(v.kid) : 'Gast', v.pid && D.kurse[v.kid] && D.kurse[v.kid].tn && D.kurse[v.kid].tn[v.pid] ? D.kurse[v.kid].tn[v.pid].code : '', exName(v.ex), teilVon(v), v.p, v.pm, v.pct, v.dur].map(q).join(';')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + z.join('\r\n')], { type: 'text/csv' }));
    a.download = 'ergebnisse_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  };
}

/* ---------------- KURSE & CODES ---------------- */
function alleCodes() { const s = new Set(); kursListe().forEach(([, k]) => Object.values(k.tn || {}).forEach(t => s.add(t.code))); return s; }
async function neuerCode(belegt) {
  for (let i = 0; i < 30; i++) { const c = zufall(5); if (belegt.has(c)) continue; if (!(await db.get('codes/' + c))) { belegt.add(c); return c; } }
  throw new Error('Kein freier Code gefunden');
}
/* ---------------- Wiederherstellung ---------------- */
function rettungsDaten() {
  const K = {};
  const add = (kid, kurs, pid, name, code) => {
    if (!kid || !pid || typeof kid !== 'string' || typeof pid !== 'string') return;
    const k = K[kid] || (K[kid] = { name: '', tn: {} }); if (kurs && !k.name) k.name = kurs;
    const p = k.tn[pid] || (k.tn[pid] = { name: '', code: '' }); if (name && name !== 'Gast') p.name = name; if (code) p.code = code;
  };
  for (const ex of Object.values(D.res || {})) for (const v of Object.values(ex || {})) add(v.kid, v.kurs, v.pid, v.name);
  for (const v of Object.values(D.live || {})) add(v.kid, v.kurs, v.pid, v.name);
  for (const [code, w] of Object.entries(D.wieder || {})) add(w.kid, w.kurs, w.pid, w.name, code);
  // nur, was in den Kursen noch fehlt
  const fehlt = {};
  for (const [kid, k] of Object.entries(K)) {
    const da = D.kurse[kid], tn = {};
    for (const [pid, p] of Object.entries(k.tn)) { const alt = da && da.tn && da.tn[pid]; if (!alt || (!alt.code && p.code)) tn[pid] = p; }
    if (!da || Object.keys(tn).length) fehlt[kid] = { name: (da && da.name) || k.name || 'Kurs ' + kid, neu: !da, tn };
  }
  return fehlt;
}
function rettungsKarte() {
  const f = rettungsDaten(), ks = Object.entries(f); if (!ks.length) return '';
  const pers = ks.reduce((a, [, k]) => a + Object.keys(k.tn).length, 0), mitCode = ks.reduce((a, [, k]) => a + Object.values(k.tn).filter(p => p.code).length, 0);
  return `<div class="karte" style="margin-top:16px;border:2px solid #e0a800;background:#fffaf0"><h2 style="margin-top:0">🛟 Wiederherstellung</h2>
    <p>Aus den gespeicherten Ergebnissen und den Rückmeldungen der Handys wurden <b>${ks.length} Kurs${ks.length > 1 ? 'e' : ''}</b> mit <b>${pers} Personen</b> gefunden, die in der Kursliste fehlen. <b>${mitCode}</b> davon haben ihren alten Code schon zurückgemeldet.</p>
    <div class="tabwrap"><table class="t"><tr><th>Kurs</th><th>Personen</th><th>alter Code bekannt</th></tr>${ks.map(([kid, k]) => `<tr><td><b>${esc(k.name)}</b>${k.neu ? ' <span class="pille">fehlt</span>' : ''}</td><td>${Object.values(k.tn).map(p => esc(p.name || '?') + (p.code ? ' ✓' : '')).join(', ')}</td><td>${Object.values(k.tn).filter(p => p.code).length} / ${Object.keys(k.tn).length}</td></tr>`).join('')}</table></div>
    <p class="leise klein">✓ = Code ist bekannt und wird genau so wieder eingetragen – die Person kann sofort weiterspielen. Personen ohne ✓ erscheinen im Kurs ohne Code: Sobald sie die Übungszentrale auf ihrem Handy öffnen, meldet sich ihr alter Code hier. Alternativ mit 🔄 einen neuen Code vergeben.</p>
    <button class="btn" id="retten">Alles wiederherstellen</button></div>`;
}
async function retten() {
  const f = rettungsDaten(), up = {};
  for (const [kid, k] of Object.entries(f)) {
    if (k.neu) { up['kurse/' + kid + '/name'] = k.name; up['kurse/' + kid + '/t'] = Date.now(); up['pub/kurse/' + kid + '/name'] = k.name; }
    for (const [pid, p] of Object.entries(k.tn)) {
      up['kurse/' + kid + '/tn/' + pid] = { name: p.name || '?', code: p.code || '', t: Date.now() };
      if (p.code) { up['codes/' + p.code] = { kid, pid, name: p.name || '?', kurs: k.name }; up['wieder/' + p.code] = null; }
    }
  }
  if (!Object.keys(up).length) return;
  await db.update('', sicher(up)); meld('Wiederhergestellt.');
}

  const d = $('#rubDet'); if (d) d.ontoggle = () => { F.rubOffen = d.open; };
  app.querySelectorAll('[data-rf]').forEach(i => i.onchange = () => { const f = i.dataset.f; let v = i.value.trim(); if (f === 'pos') v = +v || 0; if (f !== 'u' && v === '') return; db.set('pub/rubriken/' + i.dataset.rf + '/' + f, v); });
  app.querySelectorAll('[data-raus]').forEach(c => c.onchange = () => db.set('pub/rubriken/' + c.dataset.raus + '/aus', c.checked ? null : true));
  app.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => { if (confirm('Rubrik löschen? Zugeordnete Übungen landen wieder in ihrer Standard-Rubrik.')) db.set('pub/rubriken/' + b.dataset.rdel, null); });
  const f = $('#rubNeu'); if (f) f.onsubmit = e => { e.preventDefault(); const t = $('#rubNeuT').value.trim(); if (!t) return;

}

const offeneAbgaben = () => Object.values(D.abgaben || {}).filter(a => a && !a.st).length;

  F.sid = null;

      <div class="fbchips">${[['offen', `⏳ zu korrigieren (${offeneAbgaben()})`], ['frei', '✅ freigegeben'], ['alle', 'alle']].map(([k, t]) => `<button class="chip ${F.tst === k ? 'an' : ''}" data-tst="${k}">${t}</button>`).join('')}</div>
      <span style="flex:1"></span><a class="btn zweit klein" href="${mitDemo('schreibwerkstatt.html')}" target="_blank">Schreibwerkstatt ansehen</a></div>
    ${l.length ? `<div class="tabwrap"><table class="t"><tr><th>Abgabe</th><th>Name</th><th>Kurs</th><th>Aufgabe</th><th>Wörter</th><th>Status</th></tr>${l.map(a => `<tr style="cursor:pointer" data-sid="${a.sid}"><td class="klein">${zeit(a.t)}</td><td><b>${esc(a.name)}</b>${a.sperr ? ` <span title="${a.sperr}× Einfügen versucht" style="color:#b3402f">✋${a.sperr}</span>` : ''}${a.vor ? ' <span class="pill" style="background:#e9e4f7;color:#5b4fa3">überarbeitet</span>' : ''}</td><td class="klein">${esc(a.kurs || kursName(a.kid))}</td><td>${esc(a.titel || a.auf)}</td><td>${a.worte || ''}</td>
      <td>${a.st === 'frei' ? `<span class="pill" style="background:#e4f3ea;color:#2f7d57">✅ ${datum(a.tFrei)}</span>` : a.k ? '<span class="pill" style="background:#fdf0cf;color:#8a6410">in Arbeit</span>' : '<span class="pill">neu</span>'}</td></tr>`).join('')}</table></div>`
      : `<p class="leise">${F.tst === 'offen' ? 'Keine offenen Abgaben. 🎉' : 'Keine Abgaben.'}</p>`}
    <div class="fbgrid" style="margin-top:20px">
      <div class="karte"><h3>Eigene Schreibaufgabe anlegen</h3><form id="eigAuf" style="display:grid;gap:8px">

          <label class="klein">Wörter <input id="eaMin" type="number" value="100" style="width:72px"> – <input id="eaMax" type="number" value="150" style="width:72px"></label><label class="klein">Min. <input id="eaZ" type="number" value="20" style="width:64px"></label></div>

async function ltPruefen(sid, neu = false) {
  const a = D.abgaben[sid]; if (!a || ltLaeuft.has(sid)) return;
  if (a.k && a.k.lt && !neu) return;
  ltLaeuft.add(sid);
  const eigene = ((a.k && a.k.korr) || []).filter(k => k.q !== 'lt');
  try {
    const r = await fetch('https://api.languagetool.org/v2/check', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ text: a.text, language: 'de-DE' }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const lt = (j.matches || []).map(m => { const k = SW_ltKat(m); return { o: m.offset, l: m.length, e: (m.replacements && m.replacements[0] && m.replacements[0].value) || '', h: m.message || '', k, q: 'lt', an: k !== 'S' }; });
    const auf = SWAUF(a.auf), an = SW_analysiere(a.text, auf);
    await db.update('', sicher({ ['abgaben/' + sid + '/k/korr']: [...eigene, ...lt], ['abgaben/' + sid + '/k/lt']: Date.now(), ['abgaben/' + sid + '/k/ltFehler']: null,
      ...(a.k && a.k.punkte ? {} : { ['abgaben/' + sid + '/k/punkte']: an.punkte.map(p => p.ok) }) }));
  } catch (e) {
    await db.update('', sicher({ ['abgaben/' + sid + '/k/ltFehler']: String(e.message || e).slice(0, 120), ['abgaben/' + sid + '/k/lt']: Date.now() }));
  } finally { ltLaeuft.delete(sid); }
}

function korrEditor(sid) {
  const a = D.abgaben[sid], auf = SWAUF(a.auf), k = a.k || {}, text = a.text || '';
  if (!k.lt) ltPruefen(sid);
  const korr = (k.korr || []).map((x, i) => ({ ...x, i }));
  const an = SW_analysiere(text, auf);
  const pk = (k.punkte || an.punkte.map(p => p.ok));
  const fehler = korr.filter(x => x.an && x.k !== 'S' && x.k !== 'I').length;
  const vs = SW_vorschlag(an, fehler, auf), bew = k.bew || {};
  const offen = Object.entries(D.abgaben).filter(([, x]) => !x.st).sort((x, y) => x[1].t - y[1].t).map(([s]) => s);
  const nx = offen[(offen.indexOf(sid) + 1) % Math.max(offen.length, 1)];
  const vorher = a.vor && D.abgaben[a.vor];
  // Text mit Markierungen (nur Original-Text, damit Markieren per Maus die richtigen Positionen liefert)
  let h = '', pos = 0;
  for (const x of korr.filter(x => x.an).sort((p, q) => p.o - q.o)) {
    if (x.o < pos || x.o + x.l > text.length) continue;
    const K = SW_KAT[x.k] || SW_KAT.W;
    h += esc(text.slice(pos, x.o)) + `<span class="km${x.l ? '' : ' null'}" data-ki="${x.i}" data-n="${x.i + 1}" style="--kc:${K.c}" title="${esc(K.t + ': ' + (x.e ? '→ ' + x.e + ' · ' : '') + x.h)}">${esc(text.substr(x.o, x.l))}</span>`;
    pos = x.o + x.l;
  }
  h += esc(text.slice(pos));
  const sel = (v, name) => `<select data-bew="${name}"><option value="">–</option>${Object.entries(SW_STUFE).map(([s, S]) => `<option value="${s}" ${v === s ? 'selected' : ''}>${esc(S.t)}</option>`).join('')}</select>`;
  app.innerHTML = `<div class="leiste" style="margin-top:16px"><button class="btn zweit klein" id="tZur">← Alle Abgaben</button><span style="flex:1"></span>${nx && nx !== sid ? `<button class="btn zweit klein" id="tNx">Nächste offene Abgabe ›</button>` : ''}</div>
    <div class="karte"><div class="zeile"><div style="flex:1"><h2 style="margin:0">${esc(a.name)} · ${esc(auf.titel || a.titel)}</h2><div class="leise klein">${esc(a.kurs || '')} · abgegeben ${zeit(a.t)} · ${wortzahlTxt(text)} Wörter (Ziel ${auf.worte ? auf.worte.join('–') : '–'})${a.vor ? ' · <b>überarbeitete Fassung</b>' : ''}${a.tipp != null ? ' · Schreibzeit ca. ' + a.tipp + ' Min.' : ''}${a.sperr ? ` · <span style="color:#b3402f;font-weight:700" title="So oft wurde versucht, Text einzufügen. Das Einfügen wurde blockiert.">✋ ${a.sperr}× Einfügen versucht</span>` : ''}</div></div>
      ${a.st === 'frei' ? `<span class="pill" style="background:#e4f3ea;color:#2f7d57">✅ freigegeben ${zeit(a.tFrei)}</span>` : ''}</div>
      ${auf.situation ? `<details style="margin-top:8px"><summary class="klein"><b>Aufgabenstellung</b></summary><p class="klein">${esc(auf.situation)}</p>${auf.material ? `<div class="klein" style="white-space:pre-line;background:#faf7f1;padding:8px;border-radius:8px">${esc(auf.material)}</div>` : ''}</details>` : ''}
      ${vorher ? `<details style="margin-top:6px"><summary class="klein"><b>Erste Fassung ansehen</b></summary><div class="klein" style="white-space:pre-wrap;background:#faf7f1;padding:8px;border-radius:8px">${esc(vorher.text)}</div></details>` : ''}</div>
    <div class="korrgrid">
      <div><div class="karte"><div class="zeile" style="margin-bottom:6px"><b style="flex:1">Text</b><span class="leise klein">Stelle mit der Maus markieren → eigene Korrektur hinzufügen</span></div>
          <div id="kt" class="ktext">${h}</div></div>
        <div class="karte" style="margin-top:12px"><b>Kommentar für ${esc(a.name)}</b>
          <div class="zeile" style="gap:4px;margin:6px 0">${['Gut gemacht! ', 'Du hast alle Inhaltspunkte bearbeitet. ', 'Achte auf die Verbposition im Nebensatz. ', 'Nutze mehr Konnektoren (außerdem, deshalb, trotzdem). ', 'Denk an Anrede und Grußformel. ', 'Dein Text ist zu kurz – schreib zu jedem Punkt 2–3 Sätze. '].map(b => `<button class="chip" data-bs="${esc(b)}">${esc(b.trim())}</button>`).join('')}</div>
          <textarea id="kom" style="min-height:110px" placeholder="Persönliche Rückmeldung …">${esc(k.kom || '')}</textarea></div></div>
      <div class="kseite">
        <div class="karte"><div class="zeile"><b style="flex:1">Automatische Prüfung</b><button class="btn zweit klein" id="ltNeu" title="LanguageTool erneut ausführen (eigene Korrekturen bleiben)">🔄 LanguageTool</button></div>
          <div class="klein ${k.ltFehler ? '' : 'leise'}" style="margin:4px 0 8px">${ltLaeuft.has(sid) || !k.lt ? '⏳ LanguageTool prüft den Text …' : k.ltFehler ? `⚠️ LanguageTool nicht erreichbar (${esc(k.ltFehler)}). Du kannst trotzdem korrigieren.` : `LanguageTool: ${korr.filter(x => x.q === 'lt').length} Hinweise · geprüft ${zeit(k.lt)}`}</div>
          ${an.hinweise.map(x => `<div class="klein">${x.ok ? '✅' : '⚠️'} ${esc(x.t)}</div>`).join('')}
          ${auf.punkte && auf.punkte.length ? `<div style="margin-top:8px"><b class="klein">Inhaltspunkte</b> <span class="leise klein">(automatisch erkannt – bitte prüfen)</span>${auf.punkte.map((p, i) => `<label class="schalter klein" style="padding:2px 0"><input type="checkbox" data-pk="${i}" ${pk[i] ? 'checked' : ''}> ${esc(p.t)}</label>`).join('')}</div>` : ''}</div>
        <div class="karte"><b>Korrekturen (${korr.filter(x => x.an).length} von ${korr.length} übernommen)</b>
          <div class="klist">${korr.sort((p, q) => p.o - q.o).map(x => { const K = SW_KAT[x.k] || SW_KAT.W; return `<div class="kitem ${x.an ? '' : 'aus'}" style="--kc:${K.c}" id="ki-${x.i}">
            <div class="zeile" style="gap:6px"><input type="checkbox" data-kan="${x.i}" ${x.an ? 'checked' : ''} title="übernehmen"><span class="n">${x.i + 1}</span><b class="klein">„${esc(text.substr(x.o, x.l) || '‸')}“</b><span style="flex:1"></span>
              <select data-kk="${x.i}" class="klein">${Object.entries(SW_KAT).map(([c, C]) => `<option value="${c}" ${x.k === c ? 'selected' : ''}>${esc(C.t)}</option>`).join('')}</select><button class="icon" data-kdel="${x.i}" title="Löschen">🗑</button></div>
            <div class="zeile" style="gap:6px;margin-top:4px"><span class="klein">→</span><input type="text" data-ke="${x.i}" value="${esc(x.e || '')}" placeholder="Verbesserung" style="flex:1;min-height:34px;padding:4px 8px"></div>
            <input type="text" data-kh="${x.i}" value="${esc(x.h || '')}" placeholder="Erklärung" style="width:100%;min-height:34px;padding:4px 8px;margin-top:4px;font-size:.88rem">
            ${x.q === 'lt' ? '<span class="leise" style="font-size:.72rem">LanguageTool</span>' : ''}</div>`; }).join('') || '<p class="leise klein">Noch keine Korrekturen.</p>'}</div></div>
        <div class="karte"><b>Bewertung</b> <span class="leise klein">Vorschlag aus der Analyse in Klammern · Fehlerdichte ${vs.dichte} / 100 Wörter</span>
          ${SW_KRIT.map(([c, t]) => `<div class="zeile" style="justify-content:space-between;padding:4px 0"><span class="klein">${esc(t)} <span class="leise">(${vs[c]})</span></span>${sel(bew[c], c)}</div>`).join('')}
          <button class="btn zweit klein" id="vsUeb" style="margin-top:6px">Vorschlag übernehmen</button></div>
        <div class="karte frei"><label class="schalter klein"><input type="checkbox" id="inFb" ${a.pid ? 'checked' : 'disabled'}> Bewertung auch ins Feedback („Kriterien Schreiben“) übernehmen</label>
          <div class="zeile" style="margin-top:8px"><button class="btn" id="freigeben">${a.st === 'frei' ? '🔄 Erneut freigeben' : '✅ Korrektur freigeben'}</button>${a.st === 'frei' ? '<button class="btn zweit klein" id="zurueck">Zurückziehen</button>' : ''}</div>
          <p class="leise klein" style="margin:6px 0 0">${a.code ? `${esc(a.name)} sieht danach den markierten Text, deine Erklärungen, die Bewertung und den Kommentar unter „Schreibwerkstatt → Meine Texte“.` : 'Ohne Code kann nichts freigegeben werden.'}</p></div>
      </div></div>`;
  const K = 'abgaben/' + sid + '/k/';
  const setK = (i, f, v) => { const l = (k.korr || []).slice(); l[i] = { ...l[i], [f]: v }; db.set(K + 'korr', l); };
  $('#tZur').onclick = () => { F.sid = null; texteTab(); };
  const n = $('#tNx'); if (n) n.onclick = () => { F.sid = nx; scrollTo(0, 0); texteTab(); };
  $('#ltNeu').onclick = () => ltPruefen(sid, true);
  app.querySelectorAll('[data-kan]').forEach(c => c.onchange = () => setK(+c.dataset.kan, 'an', c.checked));
  app.querySelectorAll('[data-kk]').forEach(c => c.onchange = () => setK(+c.dataset.kk, 'k', c.value));
  app.querySelectorAll('[data-ke]').forEach(c => c.onchange = () => setK(+c.dataset.ke, 'e', c.value));
  app.querySelectorAll('[data-kh]').forEach(c => c.onchange = () => setK(+c.dataset.kh, 'h', c.value));
  app.querySelectorAll('[data-kdel]').forEach(b => b.onclick = () => { const l = (k.korr || []).slice(); l.splice(+b.dataset.kdel, 1); db.set(K + 'korr', l); });
  app.querySelectorAll('[data-pk]').forEach(c => c.onchange = () => { const l = (auf.punkte || []).map((_, i) => !!pk[i]); l[+c.dataset.pk] = c.checked; db.set(K + 'punkte', l); });
  app.querySelectorAll('[data-bew]').forEach(s => s.onchange = () => db.set(K + 'bew/' + s.dataset.bew, s.value || null));
  $('#vsUeb').onclick = () => db.set(K + 'bew', { wa: vs.wa, wk: vs.wk, wf: vs.wf, ws: vs.ws });
  $('#kom').onchange = e => db.set(K + 'kom', e.target.value);
  app.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => { const t = $('#kom'); t.value = (t.value + (t.value && !/\s$/.test(t.value) ? ' ' : '') + b.dataset.bs); db.set(K + 'kom', t.value); });
  app.querySelectorAll('.km').forEach(m => m.onclick = () => { const el = $('#ki-' + m.dataset.ki); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('blink'); setTimeout(() => el.classList.remove('blink'), 1200); } });
  // eigene Korrektur: Text markieren
  const kt = $('#kt');
  kt.onmouseup = () => setTimeout(() => {
    document.querySelectorAll('.kpop').forEach(x => x.remove());
    const s = getSelection(); if (!s.rangeCount || s.isCollapsed) return;
    const r = s.getRangeAt(0); if (!kt.contains(r.startContainer) || !kt.contains(r.endContainer)) return;
    const vor = document.createRange(); vor.setStart(kt, 0); vor.setEnd(r.startContainer, r.startOffset);
    const o = vor.toString().length, l = r.toString().length; if (!l || text.substr(o, l) !== r.toString()) return;
    const box = r.getBoundingClientRect(), p = document.createElement('div'); p.className = 'kpop';
    p.innerHTML = `<div class="klein"><b>„${esc(r.toString().slice(0, 40))}“</b></div><input type="text" id="kpE" value="${esc(r.toString())}" placeholder="Verbesserung (leer = streichen)">
      <input type="text" id="kpH" placeholder="Erklärung (optional)"><div class="zeile" style="gap:6px"><select id="kpK">${Object.entries(SW_KAT).map(([c, C]) => `<option value="${c}">${esc(C.t)}</option>`).join('')}</select><button class="btn klein" id="kpOk">+ Korrektur</button><button class="icon" id="kpX">✕</button></div>`;
    document.body.append(p);
    p.style.left = Math.max(8, Math.min(box.left + scrollX, scrollX + innerWidth - 330)) + 'px'; p.style.top = (box.bottom + scrollY + 6) + 'px';
    $('#kpE').focus(); $('#kpE').select();
    $('#kpX').onclick = () => p.remove();
    $('#kpOk').onclick = () => { const l2 = (k.korr || []).slice(); l2.push({ o, l, e: $('#kpE').value, h: $('#kpH').value, k: $('#kpK').value, q: 'lk', an: true }); p.remove(); getSelection().removeAllRanges(); db.set(K + 'korr', l2); };
    p.onkeydown = e => { if (e.key === 'Enter') $('#kpOk').click(); if (e.key === 'Escape') p.remove(); };
  }, 0);
  $('#freigeben').onclick = async () => {
    if (!a.code) return meld('Ohne Code kann nichts freigegeben werden.');
    const kom = $('#kom').value, t = Date.now();
    const fassung = { auf: a.auf, titel: auf.titel || a.titel, t: a.t, tFrei: t, text, kom,
      korr: (k.korr || []).filter(x => x.an).map(x => ({ o: x.o, l: x.l, e: x.e || '', h: x.h || '', k: x.k })),
      bew: Object.fromEntries(Object.entries(k.bew || {}).filter(([, v]) => v)), punkte: (auf.punkte || []).map((p, i) => ({ t: p.t, ok: !!pk[i] })) };
    const up = { ['mein/' + a.code + '/texte/' + sid]: fassung, ['abgaben/' + sid + '/st']: 'frei', ['abgaben/' + sid + '/tFrei']: t, [K + 'kom']: kom };
    if ($('#inFb').checked && a.kid && a.pid && D.kurse[a.kid] && D.kurse[a.kid].tn && D.kurse[a.kid].tn[a.pid]) {
      const b = fbPfad(a.kid, a.pid);
      Object.entries(fassung.bew).forEach(([c, s], j) => { up[b + '/c/kschreiben_' + c + '/s'] = SW_STUFE[s].v; up[b + '/c/kschreiben_' + c + '/t'] = t; up[b + '/h/' + (t + j)] = 'kschreiben_' + c + ':' + SW_STUFE[s].v; });
      up[b + '/log/' + (t + 9)] = `Schreibwerkstatt: „${auf.titel || a.titel}“ korrigiert · ${fassung.korr.length} Korrekturen` + (Object.keys(fassung.bew).length ? ' · ' + SW_KRIT.filter(([c]) => fassung.bew[c]).map(([c, n]) => n.split(':')[0] + ' ' + fassung.bew[c]).join(', ') : '');
    }
    await db.update('', sicher(up)); meld('Freigegeben – ' + a.name + ' sieht die Korrektur jetzt.');
    const nx2 = Object.entries(D.abgaben).filter(([s, x]) => !x.st && s !== sid).sort((x, y) => x[1].t - y[1].t)[0];
    if (nx2 && confirm('Weiter zur nächsten offenen Abgabe?')) { F.sid = nx2[0]; scrollTo(0, 0); texteTab(); }
  };
  const zb = $('#zurueck'); if (zb) zb.onclick = async () => { if (!confirm('Korrektur für die Person wieder ausblenden?')) return; await db.update('', sicher({ ['mein/' + a.code + '/texte/' + sid]: null, ['abgaben/' + sid + '/st']: null })); };
}
const wortzahlTxt = t => SW_wortzahl(t);

/* ---------------- ÜBUNGEN ---------------- */
function uebungen() {
  const alle = versuche(), kl = kursListe(), ws = werke();
  const passt = e => F.werk === 'alle' || (F.werk === 'ohne' ? !e.quelle : e.quelle && e.quelle.werk === F.werk);
  const liste = KATALOG.filter(passt).slice().sort((a, b) => {
    const wa = a.quelle ? a.quelle.werk : '', wb = b.quelle ? b.quelle.werk : '';
    return wa.localeCompare(wb) || KATALOG.indexOf(a) - KATALOG.indexOf(b);
  });
  const gruppe = e => e.quelle ? e.quelle.werk : 'Prüfungstraining & Spiele (ohne Lehrwerk)';
  let letzte = null;
  const RL = rubriken((D.pub || {}).rubriken || {}), RW = RL.filter(r => r.k !== 'meine');
  const anz = k => KATALOG.filter(e => e.id !== 'live' && rubrikVon(e, D.pub.ex || {}, RL) === k).length;
  app.innerHTML = rubrikKarte(RL, anz) + `<p class="leise" style="margin-top:16px">Alle Übungen aus <code>katalog.js</code>. <b>Öffentlich</b> = in der Zentrale für alle sichtbar und ohne Code spielbar. Ist eine Übung nicht öffentlich, sehen sie nur die Kurse, denen du sie zuweist. Die Angaben 📚 zu Lehrwerk und Lektion siehst nur du.</p>
    <div class="leiste"><label for="wf">Lehrwerk:</label><select id="wf"><option value="alle">Alle</option>${ws.map(w => `<option value="${esc(w)}" ${F.werk === w ? 'selected' : ''}>${esc(w)} (${KATALOG.filter(e => e.quelle && e.quelle.werk === w).length})</option>`).join('')}<option value="ohne" ${F.werk === 'ohne' ? 'selected' : ''}>Prüfungstraining & Spiele (${KATALOG.filter(e => !e.quelle).length})</option></select></div>
    <div style="display:grid;gap:12px">${liste.map(e => {
      const p = (D.pub.ex || {})[e.id], offen = p && typeof p.offen === 'boolean' ? p.offen : e.offen !== false;
      const vs = alle.filter(v => v.ex === e.id), d = vs.length ? Math.round(vs.reduce((a, v) => a + (v.pct || 0), 0) / vs.length) : null;
      const aktiv = Object.values(D.live || {}).filter(v => v.ex === e.id && status(v) === 'aktiv').length;
      const kopf = gruppe(e) !== letzte ? (letzte = gruppe(e), `<h2 style="margin:14px 0 0">${e.quelle ? '📚 ' : '🎯 '}${esc(letzte)}</h2>`) : '';
      return kopf + `<div class="exk"><div class="kopfz"><div class="farbe" style="background:${e.farbe}"></div><div style="flex:1"><h3 style="margin:0">${esc(e.titel)} ${qBadge(e)}</h3>
        <div class="klein leise">${esc(e.typ)} · ${esc(e.niveau)} · ${esc(e.untertitel || '')}</div></div>
        <a class="btn zweit klein" href="${mitDemo(e.datei)}" target="_blank">Öffnen</a><button class="btn zweit klein" data-cp="${e.datei}">🔗 Link</button></div>
        <div class="zeile klein"><span><b>${vs.length}</b> Durchgänge</span><span>Ø <b>${d == null ? '–' : d + ' %'}</b></span>${aktiv ? `<span style="color:#1e7a45"><span class="puls"></span>${aktiv} spielen gerade</span>` : ''}
        <span style="flex:1"></span><button class="btn zweit klein" data-st="${e.id}">Statistik →</button></div>
        <div class="zeile"><label class="schalter"><input type="checkbox" data-of="${e.id}" ${offen ? 'checked' : ''}> <b>Öffentlich</b> (ohne Code spielbar)</label>
          ${e.id !== 'live' ? `<span style="flex:1"></span><label class="klein leise" for="rub-${e.id}">Rubrik auf der Startseite:</label><select id="rub-${e.id}" data-rub="${e.id}">${RW.map(r => `<option value="${r.k}" ${rubrikVon(e, D.pub.ex || {}, RL) === r.k ? 'selected' : ''}>${r.ic} ${esc(r.t)}${r.aus ? ' (ausgeblendet)' : ''}</option>`).join('')}</select>` : ''}</div>
        ${kl.length ? `<div class="zeile klein"><span class="leise">Kurse:</span>${kl.map(([kid, k]) => `<label class="schalter"><input type="checkbox" data-k="${kid}" data-e="${e.id}" ${D.pub.kurse && D.pub.kurse[kid] && D.pub.kurse[kid].ex && D.pub.kurse[kid].ex[e.id] ? 'checked' : ''}> ${esc(k.name)}</label>`).join('')}</div>` : ''}</div>`; }).join('')}</div>`;
  $('#wf').onchange = ev => { F.werk = ev.target.value; uebungen(); };
  app.querySelectorAll('[data-of]').forEach(c => c.onchange = () => db.set('pub/ex/' + c.dataset.of + '/offen', c.checked));
  app.querySelectorAll('[data-rub]').forEach(s => s.onchange = () => db.set('pub/ex/' + s.dataset.rub + '/rubrik', s.value));
  bindeRubriken();
  app.querySelectorAll('[data-k]').forEach(c => c.onchange = () => db.set('pub/kurse/' + c.dataset.k + '/ex/' + c.dataset.e, c.checked ? true : null));
  app.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => navigator.clipboard.writeText(BASE + b.dataset.cp).then(() => meld('Link kopiert.'), () => prompt('Link:', BASE + b.dataset.cp)));
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { F.eex = b.dataset.st; F.ekurs = 'alle'; document.querySelector('.tab[data-t=erg]').click(); });
}
</script>
</body>
