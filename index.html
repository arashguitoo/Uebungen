<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übungszentrale – Lern Deutsch mit Arash</title>
<link rel="stylesheet" href="stil.css?v=20261016a">
<style>
  .held{background:linear-gradient(135deg,#1f2328,#2f3f46);color:#fff;padding:34px 0 60px}
  .held h1{font-size:2rem;margin-bottom:4px}
  .held p{opacity:.85;margin:0}
  .anmeld{margin-top:-40px}
  .anmeld .reihe{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:640px){.anmeld .reihe{grid-template-columns:1fr}}
  .code-in{font-size:1.4rem;letter-spacing:.2em;text-transform:uppercase;width:100%;text-align:center;font-weight:700}
  .fehler{color:var(--fehler);font-weight:600;min-height:1.4em;margin:6px 0 0}
  .gruss{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .gruss .ava{width:52px;height:52px;border-radius:50%;background:var(--akzent);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:700}
  .liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:10px}
  .ex{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--linie);border-radius:var(--r);overflow:hidden;box-shadow:var(--schatten);transition:transform .15s}
  .ex:hover{transform:translateY(-2px)}
  .ex .band{height:8px}
  .ex .inh{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
  .ex h3{margin:0;font-size:1.15rem}
  .ex .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
  .ex .best{font-weight:700;color:var(--ok)}
  .abschnitt{margin:28px 0 6px;display:flex;align-items:baseline;gap:10px}
  .filter{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--linie);background:#fff;border-radius:99px;padding:4px 12px;font:inherit;font-size:.9rem;cursor:pointer}
  .chip.an{background:#1f2328;color:#fff;border-color:#1f2328}
  .kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}
  .kacheln.oben{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:22px}
  .kachel{position:relative;display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--linie);box-shadow:var(--schatten);text-decoration:none;color:inherit;border-top:5px solid var(--f,#888);transition:transform .15s}
  .kachel:hover{transform:translateY(-2px)}
  .kachel .ic{font-size:2rem;flex:none}
  .kachel .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .kachel .tx b{font-size:1.1rem}
  .kachel .tx span{font-size:.88rem;color:var(--leise)}
  .kachel .tx .u{font-size:.82rem}
  .kachel .pf{color:var(--leise);font-size:1.2rem}
  .kachel.gross{border-top:0;color:#fff}
  .kachel.gross .tx span,.kachel.gross .pf{color:rgba(255,255,255,.85)}
  .kachel.fb{background:linear-gradient(135deg,#26324a,#3f5f9a)}
  .kachel.live{background:linear-gradient(135deg,#1f6f78,#2e9a8f)}
  .kachel .neu{position:absolute;top:10px;right:12px;background:#ffd166;color:#1f2328;font-weight:700;font-size:.75rem;padding:2px 8px;border-radius:99px}
  .rkopf{margin:24px 0 6px}
  .rkopf h2{margin:6px 0 2px}
  .rkopf p{margin:0}
  .zur{font-weight:600;text-decoration:none}
  footer{margin:40px 0 20px;text-align:center}
  .lernstand{display:flex;gap:14px;align-items:center;margin-top:22px;padding:16px 18px;border-radius:var(--r);background:linear-gradient(135deg,#5b4fa3,#2f6fc4);color:#fff;text-decoration:none;box-shadow:var(--schatten)}
  .lernstand .ic{font-size:2rem}.lernstand:hover{filter:brightness(1.07)}
</style>
<script data-goatcounter="https://aguitoo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="demo"></div>
<section class="held"><div class="wrap">
  <h1>Übungszentrale</h1>
  <p>Lern Deutsch mit Arash · Spiele, Übungen und Prüfungstraining</p>
</div></section>

<main class="wrap">
  <div class="karte anmeld" id="anmeld"></div>
  <div id="inhalt"></div>
  <footer class="klein leise">Lern Deutsch mit Arash · <a href="konsole.html">Konsole</a></footer>
</main>

<script>
/* Wächter: zeigt eine verständliche Meldung statt einer leeren Seite */
window.__ok = false;
(function () {
  function zeige(msg) {
    msg = String(msg || 'unbekannter Fehler');
    var fb = /firebase|gstatic/i.test(msg);
    var ziel = document.getElementById('app') || document.body;
    ziel.innerHTML = '<div class="karte" style="max-width:580px;margin:40px auto;border-color:#f1c6be;background:#fbe9e6">' +
      '<h2>Die Seite konnte nicht geladen werden</h2>' +
      (fb ? '<p>Die Verbindung zu Firebase hat nicht geklappt. Bitte prüfe die Internetverbindung und schalte einen Werbeblocker für diese Seite aus.</p>'
          : '<p>Bitte lade die Seite einmal komplett neu: Windows <b>Strg + F5</b>, Mac <b>Cmd + Shift + R</b>. Wenn das nicht hilft: Sind wirklich alle Dateien des Ordners hochgeladen?</p>') +
      '<p style="font-size:.85rem;color:#666">Technische Meldung: ' + msg.replace(/</g, '&lt;') + '</p></div>';
  }
  window.__fehler = zeige;
  addEventListener('error', function (e) { if (!window.__ok) zeige(e.message); });
  addEventListener('unhandledrejection', function (e) { var m = e.reason && e.reason.message || e.reason; if (!window.__ok || /firebase|gstatic/i.test(String(m))) zeige(m); });
  setTimeout(function () { if (!window.__ok) zeige('Die Programmdateien wurden nicht vollständig geladen.'); }, 12000);
})();
</script>
<script type="module">
window.__ok = true;
import { db, DEMO, esc, mitDemo } from './db.js?v=20261016a';
import { KATALOG } from './katalog.js?v=20261016a';
import { sitzung, anmelden, alsGast, abmelden, besteLokal, meldeCodeZurueck } from './spieler.js?v=20261016a';

if (DEMO) document.getElementById('demo').innerHTML = '<div class="demo-band">DEMO-MODUS – Daten bleiben nur in diesem Browser</div>';
const $ = s => document.querySelector(s);
let filt = 'alle';

const urlCode = new URLSearchParams(location.search).get('code');
meldeCodeZurueck();
if (urlCode) { try { await anmelden(urlCode); } catch (e) { } history.replaceState(null, '', location.pathname + (DEMO ? '?demo' : '')); }

function zeigeAnmeldung(fehler = '') {
  const s = sitzung();
  if (s && s.code) {
    $('#anmeld').innerHTML = `<div class="gruss"><div class="ava">${esc((s.name || '?')[0].toUpperCase())}</div>
      <div style="flex:1"><h2 style="margin:0">Hallo ${esc(s.name)}!</h2><div class="leise">${esc(s.kurs || '')} · Code ${esc(s.code)}</div></div>
      <button class="btn zweit klein" id="ab">Abmelden</button></div>`;
    $('#ab').onclick = () => { abmelden(); start(); };
    return;
  }
  $('#anmeld').innerHTML = `<div class="reihe">
    <form id="fCode"><h2>Mit Code</h2><p class="leise klein" style="margin-top:0">Dein Lehrer sieht deine Ergebnisse. Du bekommst die Übungen deines Kurses.</p>
      <input class="code-in" id="code" type="text" maxlength="8" autocomplete="off" placeholder="CODE" aria-label="Dein Code">
      <button class="btn" style="width:100%;margin-top:10px">Anmelden</button><p class="fehler" id="fe">${esc(fehler)}</p></form>
    <form id="fGast"><h2>Ohne Code</h2><p class="leise klein" style="margin-top:0">Einfach losspielen. ${s && s.gast ? 'Du spielst gerade als <b>' + esc(s.name) + '</b>.' : 'Ein Spitzname ist freiwillig.'}</p>
      <input id="gname" type="text" maxlength="30" placeholder="Spitzname (freiwillig)" style="width:100%" value="${s && s.gast && s.name !== 'Gast' ? esc(s.name) : ''}">
      <button class="btn zweit" style="width:100%;margin-top:10px">${s && s.gast ? 'Namen ändern' : 'Ohne Code spielen'}</button></form></div>`;
  $('#fCode').onsubmit = async e => {
    e.preventDefault(); $('#fe').textContent = 'Einen Moment …';
    try { await anmelden($('#code').value); start(); } catch (err) { $('#fe').textContent = err.message; }
  };
  $('#fGast').onsubmit = e => { e.preventDefault(); alsGast($('#gname').value); start(); };
}

function karte(ex, best) {
  const href = mitDemo(ex.datei);
  return `<a class="ex" href="${href}"><div class="band" style="background:${ex.farbe}"></div><div class="inh">
    <h3>${esc(ex.titel)}</h3><div class="leise klein">${esc(ex.untertitel || '')}</div>
    <div class="meta"><span class="pille" style="background:${ex.farbe}1a;color:${ex.farbe}">${esc(ex.typ)}</span><span class="pille">${esc(ex.niveau)}</span>
    ${ex.dauer ? `<span class="pille" style="background:#eee;color:#555">${esc(ex.dauer)}</span>` : ''}
    ${best != null ? `<span class="best klein">✓ ${best} %</span>` : ''}</div></div></a>`;
}

const RUBRIKEN = [
  { k: 'meine', ic: '⭐', t: 'Meine Übungen', u: 'Von deiner Lehrkraft für dich freigeschaltet', f: '#b8841a' },
  { k: 'muendlich', ic: '🗣️', t: 'Mündliche Prüfung', u: 'Problem lösen, Smalltalk, Sprechen üben', f: '#2f6b5e', reihen: ['Mündliche Prüfung'] },
  { k: 'training', ic: '🎯', t: 'Prüfungstraining', u: 'Lesen, Hören, Schreiben und Wortschatz rund um den Beruf', f: '#2f6fc4', reihen: ['Prüfungstraining B1/B2'] },
  { k: 'grammatik', ic: '🧩', t: 'Grammatik & Wortschatz', u: 'Präpositionen, Wortverbindungen und Spiele', f: '#5b4fa3', reihen: ['Grammatik-Spiele', 'Spiele'] },
  { k: 'tests', ic: '🧪', t: 'Tests', u: 'Sprachstand prüfen', f: '#3f5f9a', reihen: ['Diagnose & Tests'] },
  { k: 'weitere', ic: '📦', t: 'Weitere Übungen', u: '', f: '#666' }
];
const rubrikVon = ex => (RUBRIKEN.find(r => r.reihen && r.reihen.includes(ex.reihe)) || RUBRIKEN[RUBRIKEN.length - 1]).k;

async function start() {
  zeigeAnmeldung();
  const s = sitzung(), best = besteLokal();
  let pubEx = {}, kursEx = {};
  try { pubEx = (await db.get('pub/ex')) || {}; } catch (e) { }
  if (s && s.kid) { try { kursEx = (await db.get('pub/kurse/' + s.kid + '/ex')) || {}; } catch (e) { } }
  let mein = {};
  if (s && s.code) { try { mein = (await db.get('mein/' + s.code)) || {}; } catch (e) { console.warn('Lernstand nicht lesbar', e); } }
  const indiv = mein.ex || {};
  const offen = ex => (pubEx[ex.id] && typeof pubEx[ex.id].offen === 'boolean') ? pubEx[ex.id].offen : ex.offen !== false;
  const ohneLive = KATALOG.filter(ex => ex.id !== 'live');
  const meine = ohneLive.filter(ex => indiv[ex.id] === true || (indiv[ex.id] !== false && kursEx[ex.id]));
  const sichtbar = ohneLive.filter(ex => meine.includes(ex) || offen(ex));
  const inRubrik = k => k === 'meine' ? meine : sichtbar.filter(ex => rubrikVon(ex) === k);
  const rub = (location.hash.match(/^#r=(\w+)/) || [])[1];
  const R = RUBRIKEN.find(r => r.k === rub);
  const live = KATALOG.find(e => e.id === 'live');
  let h = '';
  if (R) {
    const l = inRubrik(R.k);
    h += `<div class="rkopf"><a href="#" class="zur">← Startseite</a><h2>${R.ic} ${esc(R.t)}</h2>${R.u ? `<p class="leise">${esc(R.u)}</p>` : ''}</div>` +
      (l.length ? `<div class="liste">${l.map(ex => karte(ex, best[ex.id])).join('')}</div>` : '<p class="leise">Hier ist gerade nichts freigeschaltet.</p>');
  } else {
    const fbNeu = mein.fb && mein.fb.t > (+localStorage.getItem('ueb_fb_gesehen_' + (s && s.code)) || 0);
    const kacheln = [];
    if (s && s.code) kacheln.push(`<a class="kachel gross fb" href="${mitDemo('lernstand.html')}"><span class="ic">📋</span><span class="tx"><b>Lehrer-Feedback & Lernstand</b><span>${mein.fb ? 'Feedback vom ' + new Date(mein.fb.t).toLocaleDateString('de-DE') : mein.sa ? 'Schätze dich selbst ein' : 'Dein Vorbereitungsstand für die Prüfung'}</span></span>${fbNeu ? '<span class="neu">Neu</span>' : ''}<span class="pf">→</span></a>`);
    if (live) kacheln.push(`<a class="kachel gross live" href="${mitDemo(live.datei)}"><span class="ic">📡</span><span class="tx"><b>Live-Runde beitreten</b><span>Mit dem PIN vom Bildschirm deiner Lehrkraft</span></span><span class="pf">→</span></a>`);
    h += kacheln.length ? `<div class="kacheln oben">${kacheln.join('')}</div>` : '';
    h += `<div class="abschnitt"><h2>Übungen</h2></div><div class="kacheln">` + RUBRIKEN.filter(r => (r.k !== 'meine' || (s && s.kid)) && (r.k === 'meine' || inRubrik(r.k).length)).map(r => {
      const l = inRubrik(r.k), fertig = l.filter(ex => best[ex.id] != null).length;
      return `<a class="kachel" href="#r=${r.k}" style="--f:${r.f}"><span class="ic">${r.ic}</span><span class="tx"><b>${esc(r.t)}</b><span>${l.length} ${l.length === 1 ? 'Übung' : 'Übungen'}${fertig ? ' · ' + fertig + ' gemacht' : ''}</span>${r.u ? `<span class="u">${esc(r.u)}</span>` : ''}</span><span class="pf">→</span></a>`;
    }).join('') + '</div>';
  }
  $('#inhalt').innerHTML = h;
  const z = document.querySelector('.zur'); if (z) z.onclick = e => { e.preventDefault(); history.pushState(null, '', location.pathname + location.search); start(); scrollTo(0, 0); };
}
addEventListener('hashchange', () => { start(); scrollTo(0, 0); });
start();
</script>
</body>
</html>
