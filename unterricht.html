<script>

   LIVE-UNTERRICHT – Lehrtafel + Aufgaben freigeben (wie der Persisch-Live-Unterricht)
   Leinwand:  unterricht.html?leitung=1[&plan=konj1]  (Übungszentrale: Konsole → 📡 Live-Unterricht)

const KURS="ploen-jik", ROOT=`ligaunterricht/${KURS}`;
const cfg={apiKey:"AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",authDomain:"lern-deutsch-arash.firebaseapp.com",databaseURL:"https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",projectId:"lern-deutsch-arash"};
let db=null, offset=0; try{ if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg); db=firebase.database(); db.ref(".info/serverTimeOffset").on("value",s=>offset=Number(s.val())||0); }catch(e){}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rnd(n){ try{ return Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n); }catch(e){ return Math.floor(Math.random()*n); } }
function mische(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* gleiche Reihenfolge für alle mit gleichem Schlüssel (Handy, Spiegel, Leinwand) */
function hash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function mischS(a, key){ let x=hash(key)||1; const r=()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return (x>>>0)/4294967296; }; a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const I=p=>db.ref(`${ROOT}/${PIN}${p?"/"+p:""}`);
const app=$("#app");
const PLAENE=window.UNTERRICHT_PLAENE||{};
let PLAN=PLAENE[P.get("plan")||P.get("solo")]||PLAENE[Object.keys(PLAENE)[0]];
const LIVE_NUR=["sprechen","bewegung","bingo","kugellager","haelften"];

function aufgabe(id){ for(const B of PLAN.bloecke) for(const A of B.aufgaben) if(A.id===id) return A; return null; }
function blockVon(id){ return PLAN.bloecke.findIndex(B=>B.aufgaben.some(A=>A.id===id)); }
/* Lücken {richtig|falsch} */
function teile(text){ const out=[]; const re=/\{([^}]+)\}/g; let m, last=0; while((m=re.exec(text))){ out.push(text.slice(last,m.index)); out.push(m[1].split("|")); last=re.lastIndex; } out.push(text.slice(last)); return out; }

/* Timer */
function tRest(T){ if(!T) return null; if(T.pause) return Math.max(0,Number(T.rest)||0); return Math.max(0,Math.ceil(((Number(T.ende)||0)-jetzt())/1000)); }

let TIMER=null;
setInterval(()=>{ $$("[data-timer]").forEach(el=>{ const r=tRest(TIMER); if(r===null) return; el.textContent=r===0&&!TIMER.pause?"⏰ Zeit!":(TIMER.pause?"⏸ ":"⏱ ")+mmss(r); el.classList.toggle("aus", r===0&&!TIMER.pause); }); }, 500);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),900); }

/* =========================================================
   GEMEINSAME AUFGABEN-ANSICHTEN (Handy live + allein)
   ctx = {pid, ant:{i:{ok,v,n}}, setze(i,val), lokal, neu()}
   ========================================================= */
function anleitung(A, steh){ return A.anleitung?`<div class="anl ${steh?"steh":""}"><b>${steh?"🚶 So geht es":"So geht es"}</b>${esc(A.anleitung)}</div>`:""; }
function fortschritt(n, ant, cur){ return `<div class="fortschritt">${Array.from({length:n},(_,i)=>`<i class="${ant[i]&&ant[i].ok?"ok":i===cur?"jetzt":""}"></i>`).join("")}</div>`; }
function aktuellerIndex(A, ant){ const L=itemsVon(A); for(let i=0;i<L.length;i++) if(!(ant[i]&&ant[i].ok)) return i; return -1; }
function ersteVersuche(A, ant){ return itemsVon(A).filter((_,i)=>ant[i]&&ant[i].ok&&ant[i].n===1).length; }
function uebungHtml(A, ctx){
  const L=itemsVon(A), ant=ctx.ant||{}; const i=aktuellerIndex(A, ant);
  let h=`<h2>${esc(A.titel)}</h2>`+anleitung(A);
  if(i<0){ const e=ersteVersuche(A,ant); return h+fortschritt(L.length,ant,-1)+`<div class="card fertig"><div class="e">✅</div><h2>Fertig!</h2><p>${e} von ${L.length} beim ersten Versuch richtig.</p><p class="muted">${ctx.weiterText||"Schau zur Tafel oder hilf deinem Nachbarn."}</p>${ctx.weiterKnopf||""}</div>`; }
  const it=L[i], a=ant[i]||{}; h+=fortschritt(L.length,ant,i)+`<div class="small muted" style="font-weight:800">${i+1} von ${L.length}</div>`;
  if(A.typ==="wahl"||A.typ==="quiz"){ const opts=mischS(it.o, A.id+"|"+i+"|"+ctx.pid);
    h+=`<div class="card"><div class="frage">${esc(it.f)}</div><div class="opts">${opts.map(o=>`<button class="opt ${a.falsch&&a.falsch["f"+it.o.indexOf(o)]?"falsch":""}" data-wahl="${esc(o)}" ${a.falsch&&a.falsch["f"+it.o.indexOf(o)]?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      ${a.n&&!a.ok?`<div class="tipp">💡 ${esc(it.tipp||"Lies den Satz noch einmal genau.")} – Versuch es noch einmal!</div>`:""}</div>`; }
  if(A.typ==="sortieren"){ h+=`<div class="card"><div class="sortkarte">${esc(it.t)}</div><div class="korb2">${A.koerbe.map((k,ki)=>`<button data-wahl="${esc(k.k)}" ${a.falsch&&a.falsch["f"+ki]?'disabled style="opacity:.35"':""}>${esc(k.t)}</button>`).join("")}</div>
      ${a.n&&!a.ok?`<div class="tipp">💡 Nicht ganz. ${A.hinweis?esc(A.hinweis):A.koerbe[0].k==="haben"?"Bewegung von A nach B oder Veränderung → sein.":"Bewegung → Wohin? Keine Bewegung → Wo?"} Versuch es noch einmal!</div>`:""}</div>`; }
  if(A.typ==="bauen"){ const L2=ctx.lokal; const key=A.id+"|"+i; if(L2.bauKey!==key){ L2.bauKey=key; L2.gelegt=[]; }
    const pool=mischS(it.w.map((w,j)=>({w,j})), key+"|"+ctx.pid);
    h+=`<div class="card"><p class="small muted" style="margin:0">Tippe die Wörter in der richtigen Reihenfolge:</p><div class="linie">${L2.gelegt.map((j,k)=>`<button class="kachel" data-raus="${k}">${esc(it.w[j])}</button>`).join("")}<b style="font-size:22px">${L2.gelegt.length===it.w.length?esc(it.p||""):""}</b></div>
      <div class="pool">${pool.map(x=>`<button class="kachel ${L2.gelegt.includes(x.j)?"weg":""}" data-rein="${x.j}">${esc(x.w)}</button>`).join("")}</div>
      <div class="row"><button class="btn ok" id="pruef" ${L2.gelegt.length===it.w.length?"":"disabled"}>Prüfen</button><button class="btn ghost" id="leeren">↺ Neu</button></div>
      ${a.n&&!a.ok?`<div class="tipp">💡 Noch nicht richtig. Wo steht das Verb? ${A.hinweis?esc(A.hinweis):A.id==="m2"?"Das Modalverb auf Position 2, das andere Verb am Ende.":"Verb auf Position 2. Dann: Wem? – Was?"}</div>`:""}</div>`; }
  return h;
}
function uebungBinden(A, ctx){
  const L=itemsVon(A), ant=ctx.ant||{}; const i=aktuellerIndex(A, ant); if(i<0) return; const it=L[i]; const a=ant[i]||{};
  $$("[data-wahl]").forEach(b=>b.onclick=()=>{ const v=b.dataset.wahl; const ok=okVon(A,it,v); const n=(a.n||0)+1;
    const fk=A.typ==="sortieren"?A.koerbe.findIndex(k=>k.k===v):it.o.indexOf(v); const neu={ok, v, n}; if(!ok){ neu.falsch=Object.assign({}, a.falsch||{}, {["f"+fk]:true}); }
    if(ok) toast(n===1?"✓ Richtig!":"✓ Jetzt richtig!"); ctx.setze(i, neu); });
  if(A.typ==="bauen"){ const L2=ctx.lokal;
    $$("[data-rein]").forEach(b=>b.onclick=()=>{ L2.gelegt.push(Number(b.dataset.rein)); ctx.neu(); });
    $$("[data-raus]").forEach(b=>b.onclick=()=>{ L2.gelegt.splice(Number(b.dataset.raus),1); ctx.neu(); });
    const le=$("#leeren"); if(le) le.onclick=()=>{ L2.gelegt=[]; ctx.neu(); };
    const pr=$("#pruef"); if(pr) pr.onclick=()=>{ const satz=norm(L2.gelegt.map(j=>it.w[j]).join(" ")); const ok=it.a.map(norm).includes(satz); const n=(a.n||0)+1;
      L2.gelegt=[]; L2.bauKey=null; if(ok) toast(n===1?"✓ Richtig!":"✓ Jetzt richtig!"); ctx.setze(i, {ok, v:satz, n}); };
  }
}
/* Theater: Rollen in der Gruppe */
function rollenVon(mitglieder, pid){ const i=mitglieder.indexOf(pid); if(i<0) return []; const n=mitglieder.length;
  if(n===1) return [0,1,2,-1]; if(n===2) return i===0?[0,2,-1]:[1]; if(i<3) return i===0&&n===3?[0,-1]:[i]; return [-2]; }
function dialogHtml(SZ, meine, modus, wahl, setzbar){
  /* modus: "luecken" (eigene Lücken wählen) | "voll" (alles ausgefüllt) */
  return `<div class="dialog">${SZ.zeilen.map(([r,text],zi)=>{ const mein=meine.includes(r)||(meine.includes(-1)&&r===-1); const wer=r<0?"Alle":SZ.rollen[r];
    const inhalt=teile(text).map((t,gi)=>{ if(!Array.isArray(t)) return esc(t); const key=zi+"_"+gi; const ok=t[0];
      if(modus==="voll") return `<span class="gefuellt">${esc(ok)}</span>`;
      if(!mein&&!setzbar) return `<span class="leer">…</span>`;
      const g=(wahl||{})[key]; if(g===ok) return `<span class="gefuellt">${esc(ok)}</span>`;
      return `<span class="luecke">${mischS(t, key).map(o=>`<button data-luecke="${key}" data-v="${esc(o)}" class="${g===o?"falsch":""}">${esc(o)}</button>`).join("")}</span>`; }).join("");
    return `<div class="z ${mein?"mein":""}"><span class="wer">${esc(wer)}${mein?" – du":""}</span>${inhalt}</div>`; }).join("")}</div>`;
}
function lueckenStand(SZ, meine, wahl, alle){ let n=0, ok=0; SZ.zeilen.forEach(([r,text],zi)=>{ if(!alle && !meine.includes(r)) return; teile(text).forEach((t,gi)=>{ if(Array.isArray(t)){ n++; if((wahl||{})[zi+"_"+gi]===t[0]) ok++; } }); }); return {n, ok}; }
function szeneVon(A, id){ return (A.szenen||[]).find(s=>s.id===id)||A.szenen[0]; }
/* Gruppenpuzzle: eigene Fetzen-Nummer(n) + Fragen zur ganzen Geschichte */
function puzzleAufgabe(A, K){ const G=A.geschichten[K.g]; const n=G.fetzen.length; const nrs=Array.from({length:n},(_,i)=>String(i+1));
  const eig=K.fs.map(f=>({f:`${G.icon} Welche Nummer hat dein Fetzen „${G.fetzen[f].slice(0,38)}…“ in der Geschichte? (Sprecht zusammen!)`, o:[String(f+1), ...nrs.filter(x=>x!==String(f+1))], tipp:"Lest alle Fetzen laut vor: Was passiert zuerst, was danach?"}));
  return {id:A.id, typ:"wahl", titel:"Gemeinsam lösen", anleitung:"", items:[...eig, ...G.items]}; }

    let sz=null; try{ sz=JSON.parse(localStorage.getItem("ueb_sitzung")||"null"); }catch(e){}

      ${vn?`<p class="muted">Du bist in der Übungszentrale angemeldet:</p><button class="btn wide" id="ich">Ich bin ${esc(vn)} ▶</button><p class="small muted" style="margin:14px 0 4px">Nicht du? Dann schreib deinen Vornamen:</p>`:`<p class="muted">Schreib deinen Vornamen.</p>`}
      <form id="nf" class="row" style="margin-top:6px"><input id="nn" type="text" placeholder="Vorname" maxlength="20" style="flex:1"><button class="btn">OK</button></form></div></div>`;
    const ib=$("#ich"); if(ib) ib.onclick=()=>{ const id=String(sz.code||sz.pid||vn).replace(/[^A-Za-z0-9]/g,"").slice(0,24)||rnd(1e6); me={pid:(sz.gast?"g":"c")+id, name:vn}; speichernMe(); };
    $("#nf").onsubmit=e=>{ e.preventDefault(); const n=$("#nn").value.trim().split(/\s+/)[0]; if(!n) return; me={pid:"g"+Math.random().toString(36).slice(2,9), name:n.slice(0,20)}; speichernMe(); };
  }
  function speichernMe(){ try{ localStorage.setItem(MEKEY(), JSON.stringify(me)); }catch(e){} los(); }
  function los(){
    if(!SPIEGEL){ const r=I(`spieler/${me.pid}`); r.update({name:me.name, ts:TS(), online:true}); try{ r.child("online").onDisconnect().set(false); }catch(e){} }
    I().on("value", s=>{ S=s.val()||{}; TIMER=S.timer||null; if(S.info&&S.info.plan&&PLAENE[S.info.plan]) PLAN=PLAENE[S.info.plan]; male(); });
  }
  const spielerListe=()=>Object.entries(S.spieler||{}).filter(([,x])=>x&&x.name);
  const nameVon=p=>((S.spieler||{})[p]||{}).name||"?";
  function relevant(){ const inf=S.info||{}; const au=inf.auf||{}; const A=au.id?aufgabe(au.id):null;
    const r={inf, t:S.timer, teams:S.teams, ich:(S.spieler||{})[me.pid], l:JSON.stringify(lokal)};
    if(A){ r.ant=((S.ant||{})[A.id]||{})[me.pid]; if(A.typ==="quiz"){ r.q=S.quiz; r.qa=(((S.qz||{})[A.id]||{})[(S.quiz||{}).i]||{})[me.pid]; }
      if(["sprechen","bewegung"].includes(A.typ)) r.z=S.zug; if(A.typ==="kugellager") r.k=S.kugel;
      if(["bingo","haelften","theater"].includes(A.typ)) r.sp=spielerListe().map(([p,x])=>p+x.name+(x.tg||"")+(x.online===false?0:1)).join();
      if(A.typ==="bingo") r.b=((S.bingo||{})[A.id]||{})[me.pid]; if(A.typ==="haelften") r.h=S.hael;

  function male(force){
    if(!S.info){ app.innerHTML=`<div class="wrap"><div class="card">Dieser Unterricht ist beendet. Danke!</div></div>`; return; }

  }

function leitung(){
  document.body.classList.add("board"); let S={}, einsicht=false, beamer=false, zuletztPiep=null, letzteZuege=[];

  async function start(){

      await I().set({info:{phase:"lobby", erstellt:TS(), pin:PIN, plan:PLAN.id, block:0, folie:0, ansicht:"tafel"}}); }
    try{ localStorage.setItem("unt_leitung_pin",PIN); }catch(e){}
    history.replaceState(null,"","?leitung=1&pin="+PIN);
    I().on("value", s=>{ S=s.val()||{}; TIMER=S.timer||null; if(S.info&&PLAENE[S.info.plan]) PLAN=PLAENE[S.info.plan]; pflege(); male(); einsichtMalen(); nachzuegler(); });
    setInterval(()=>{ const r=tRest(S.timer); if(S.timer&&!S.timer.pause&&r===0&&zuletztPiep!==S.timer.ende){ zuletztPiep=S.timer.ende; piep(); } const z=$("#planzeit"); if(z) z.innerHTML=planzeit(); },1000);
    document.addEventListener("keydown", e=>{ if(["INPUT","SELECT","TEXTAREA"].includes((e.target||{}).tagName)) return;
      if(e.key==="ArrowRight") folie(1); if(e.key==="ArrowLeft") folie(-1); if(e.key==="b"||e.key==="B"){ beamer=!beamer; document.body.classList.toggle("beamer",beamer); } });
  }
  function piep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35].forEach(t=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=660; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25,c.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.3); o.start(c.currentTime+t); o.stop(c.currentTime+t+.3); }); }catch(e){} }
  const inf=()=>S.info||{};
  const spieler=()=>Object.entries(S.spieler||{}).filter(([,x])=>x&&x.name).sort((a,b)=>String(a[1].name).localeCompare(b[1].name));
  const online=()=>spieler().filter(([,x])=>x.online!==false);
  const nm=p=>esc(((S.spieler||{})[p]||{}).name||"?");
  const aktA=()=>{ const au=inf().auf; return au&&au.id?aufgabe(au.id):null; };
  /* Neue Personen automatisch einordnen (Kugellager-Kreis) */
  function pflege(){ const A=aktA(); if(!A) return;
    if(A.typ==="puzzle" && S.puzzle && S.puzzle.aid===A.id){ const K=S.puzzle.karten||{}; const fehlt=online().filter(([p])=>!K[p]); if(fehlt.length){ const up={}; const zahl={}; Object.values(K).forEach(x=>zahl[x.g]=(zahl[x.g]||0)+1); const gl=Object.keys(zahl).map(Number); if(!gl.length) gl.push(0);
      fehlt.forEach(([p])=>{ const g=gl.sort((a,b)=>(zahl[a]||0)-(zahl[b]||0))[0]; zahl[g]=(zahl[g]||0)+1; up[p]={g, fs:[rnd(A.geschichten[g].fetzen.length)]}; }); I("puzzle/karten").update(up); } }
    if(A.typ==="kugellager" && S.kugel && S.kugel.aid===A.id){ const kr=S.kugel.kreis||{}; const fehlt=online().filter(([p])=>!kr[p]); if(fehlt.length){ const up={}; let ni=Object.values(kr).filter(x=>x==="i").length, na=Object.values(kr).filter(x=>x==="a").length; fehlt.forEach(([p])=>{ const k=ni<=na?"i":"a"; up[p]=k; k==="i"?ni++:na++; }); I("kugel/kreis").update(up); } }
  }

  /* Zeitplan */
  function planzeit(){ const st=Number(inf().start); if(!st) return ""; const min=Math.floor((jetzt()-st)/60000); const b=inf().block||0; const soll=PLAN.bloecke.slice(0,b).reduce((a,B)=>a+B.minuten,0); const bis=soll+PLAN.bloecke[b].minuten;

  /* Aufgabe freigeben */
  async function freigeben(id){ const A=aufgabe(id), b=blockVon(id); const nr=((inf().auf||{}).nr||0)+1;

  }
  function karten(A, runde){ const L=mische(online().map(([p])=>p)); const paare=mische(A.paare.map((_,i)=>i)); const k={};
    let pi=0; for(let i=0;i+1<L.length;i+=2){ const pp=paare[pi++%paare.length]; k[L[i]]={p:pp,t:0}; k[L[i+1]]={p:pp,t:1}; }

  function puzzleVerteilen(A){ const L=mische(online().map(([p])=>p)); const nf=A.geschichten[0].fetzen.length;
    const ng=Math.max(1, Math.min(A.geschichten.length, Math.round(L.length/nf)||1)); const gs=mische(A.geschichten.map((_,i)=>i)).slice(0,ng);
    const gruppen=gs.map(()=>[]); L.forEach((p,i)=>gruppen[i%ng].push(p)); const k={};
    gruppen.forEach((m,gi)=>{ const g=gs[gi]; m.forEach((p,j)=>{ let fs=[]; for(let f=0;f<nf;f++) if(f%m.length===j) fs.push(f); if(!fs.length) fs=[j%nf]; k[p]={g, fs}; }); });

  async function gruppenBilden(A){ const L=mische(online().map(([p])=>p)); const ng=Math.max(1, Math.floor(L.length/3)); const gr={}; const up={};

  function teamsSetzen(n){ const up={}; if(!n){ up.teams=null; spieler().forEach(([p])=>up[`spieler/${p}/team`]=null); return I().update(up); }
    const t={}; TEAMVORLAGE.slice(0,n).forEach((x,i)=>t["t"+i]=x); up.teams=t; mische(spieler()).forEach(([p],i)=>up[`spieler/${p}/team`]="t"+(i%n)); I().update(up); }
  /* Einsicht: Handys der Lernenden als Spiegel */
  let einsichtSig="";
  function einsichtMalen(force){ let box=$("#einsichtBox"); if(!einsicht){ if(box) box.remove(); einsichtSig=""; return; }
    const L=online(); const sg=L.map(([p])=>p).join(); if(box && sg===einsichtSig && !force) return; einsichtSig=sg;
    if(!box){ box=document.createElement("div"); box.id="einsichtBox"; document.body.appendChild(box); }
    const base=location.pathname;
    box.innerHTML=`<div class="row" style="color:#fff;margin-bottom:10px"><h2 style="margin:0">👁 Einsicht – so sehen die Handys aus</h2><button class="btn sm gold" id="ezu" style="margin-left:auto">✕ schließen</button></div><div class="eg">${L.map(([p,x])=>`<div class="ef"><b>${esc(x.name)}</b><iframe loading="lazy" src="${base}?pin=${PIN}&spiegel=1&als=${encodeURIComponent(p)}"></iframe></div>`).join("")||'<p style="color:#fff">Noch niemand online.</p>'}</div>`;
    $("#ezu").onclick=()=>{ einsicht=false; einsichtMalen(); }; }
  start();
}

/* =========================================================
   ALLEIN ÜBEN (jederzeit)
   ========================================================= */
function solo(){
  const KEY=`unt_solo_${PLAN.id}`; let st={}; try{ st=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
  const merke=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
  const lokal={gelegt:[]}; let pos=null; /* {b, schritt} */
  try{ if(window.LW) LW.init(); }catch(e){}
  const soloAufgaben=B=>B.aufgaben.filter(A=>!LIVE_NUR.includes(A.typ));
  const bloecke=()=>PLAN.bloecke.map((B,bi)=>({B,bi})).filter(x=>soloAufgaben(x.B).length);
  function schritteVon(B){ return [...B.tafel.map((F,i)=>({art:"tafel", i})), ...soloAufgaben(B).map(A=>({art:"auf", A}))]; }
  function uebersicht(){ pos=null;
    app.innerHTML=`<div class="kopf"><div class="in"><b>🔁 ${esc(PLAN.titel)}</b><a class="r btn sm hell" href="index.html">Übungszentrale</a></div></div><div class="wrap">
      <p class="muted">Wähle ein Thema. Zuerst kommt die Tafel, dann die Übungen. Jede Übung hat eine kleine Anleitung.</p>
      ${bloecke().map(({B,bi})=>{ const s=st["p_"+B.id]; return `<button class="soloblk" data-b="${bi}"><span class="e">${B.icon}</span><span><b>${esc(B.id==="theater"?"Dialoge: Party, Picknick, Weg fragen":B.titel)}</b><br><span class="small muted">${soloAufgaben(B).map(A=>({quiz:"⚡ Quiz", theater:"🎭 Dialog: Lücken & laut lesen"})[A.typ]||TYP[A.typ]).join(" · ")}</span></span>${s!==undefined?`<span class="s">✓ ${s}/10</span>`:""}</button>`; }).join("")}
      <div class="anl steh" style="margin-top:14px"><b>🚶 Nur im Unterricht</b>Kugellager, Satzhälften und die Blitzrunde machen wir zusammen im Raum. Das Gruppenpuzzle kannst du hier allein lesen.</div></div>`;
    $$("[data-b]").forEach(b=>b.onclick=()=>{ pos={b:Number(b.dataset.b), s:0}; male(); }); }
  function male(){ if(!pos) return uebersicht(); const B=PLAN.bloecke[pos.b]; const S=schritteVon(B); const X=S[pos.s];
    let h=`<div class="kopf"><div class="in"><b>${B.icon} ${esc(B.titel)}</b><span class="small" style="opacity:.8">${X?`${pos.s+1}/${S.length}`:"✓"}</span><button class="r btn sm hell" id="zurueck">✕</button></div></div><div class="wrap">`;
    if(!X) return ende(B, h);
    const weiter=`<button class="btn wide" id="weiter" style="margin-top:12px">Weiter ▶</button>`;
    if(X.art==="tafel"){ const F=B.tafel[X.i]; app.innerHTML=h+`<div class="card"><div class="small muted" style="font-weight:800">📋 Tafel</div><h2>${esc(F.titel)}</h2><div class="tafelinhalt">${F.html}</div></div>${weiter}</div>`; }
    else { const A=X.A; st.a=st.a||{};
      if(A.typ==="theater") return theaterSolo(A, h);
      const ant=st.a[A.id]||{}; const fertig=aktuellerIndex(A,ant)<0;
      const ctx={pid:"solo", ant, lokal, setze:(i,v)=>{ st.a[A.id]=Object.assign({}, st.a[A.id]||{}, {[i]:v}); merke(); setTimeout(male, v.ok?500:0); }, neu:male, weiterText:"Super gemacht!", weiterKnopf:`<button class="btn" id="weiter">Weiter ▶</button> <button class="btn ghost" id="nochmal">↺ noch einmal</button>`};
      const A2=A.typ==="quiz"?Object.assign({}, A, {typ:"wahl"}):A.typ==="puzzle"?{id:A.id, typ:"wahl", titel:"Fragen zu den Meldungen", anleitung:"", items:itemsVon(A)}:A;
      const vor=A.typ==="puzzle"?`<h2>🧩 ${esc(A.titel)}</h2><div class="anl">Im Unterricht sucht ihr die Fetzen zusammen. Hier liest du alle vier Meldungen. Unterstreiche im Kopf: Wo steht Konjunktiv I?</div>${A.geschichten.map(G=>`<div class="card" style="border-top:6px solid ${G.farbe}"><h3>${G.icon} ${esc(G.titel)}</h3>${G.fetzen.map(t=>`<p style="margin:6px 0">${esc(t)}</p>`).join("")}</div>`).join("")}`:"";
      app.innerHTML=h+vor+uebungHtml(A2, ctx)+`</div>`; uebungBinden(A2, ctx);
      const n=$("#nochmal"); if(n) n.onclick=()=>{ delete st.a[A.id]; merke(); male(); }; if(fertig){} }
    bind(); }
  function bind(){ const w=$("#weiter"); if(w) w.onclick=()=>{ pos.s++; male(); window.scrollTo(0,0); }; const z=$("#zurueck"); if(z) z.onclick=uebersicht; }
  function theaterSolo(A, h){ st.th=st.th||{}; const sz=st.thSz;
    if(!sz){ app.innerHTML=h+`<h2>🎭 ${esc(A.titel)}</h2><div class="anl">Wähle eine Szene. Du liest <b>alle Rollen</b>. 1. Fülle die Lücken. 2. Lies den Dialog laut – mit verschiedenen Stimmen!</div>${A.szenen.map(s=>`<button class="soloblk" data-sz="${s.id}"><span class="e">${s.icon}</span><span><b>${esc(s.titel)}</b><br><span class="small muted">${esc(s.situation)}</span></span></button>`).join("")}</div>`;
      $$("[data-sz]").forEach(b=>b.onclick=()=>{ st.thSz=b.dataset.sz; merke(); male(); }); bind(); return; }
    const SZ=szeneVon(A, sz); const wahl=st.th[sz]||{}; const s=lueckenStand(SZ,[0,1,2,-1],wahl,true); const voll=s.ok===s.n;
    app.innerHTML=h+`<div class="card"><h2>${SZ.icon} ${esc(SZ.titel)}</h2><p>${esc(SZ.situation)}</p></div>
      <div class="anl"><b>${voll?"Schritt 2 · Laut lesen":"Schritt 1 · Lücken"}</b>${voll?"Lies den ganzen Dialog laut. Jede Rolle mit einer anderen Stimme!":`Tippe bei jeder Lücke das richtige Wort. ${s.ok}/${s.n} richtig.`}</div>
      ${dialogHtml(SZ,[0,1,2,-1], voll?"voll":"luecken", wahl, true)}
      ${voll?`<button class="btn wide" id="weiter" style="margin-top:12px">Fertig ▶</button>`:""}<button class="btn ghost sm" id="andere" style="margin-top:10px">Andere Szene</button></div>`;
    $$("[data-luecke]").forEach(b=>b.onclick=()=>{ const k=b.dataset.luecke; const alt=wahl[k]; wahl[k]=b.dataset.v; st.th[sz]=wahl; st.thF=st.thF||{}; if(alt!==undefined && alt!==b.dataset.v){} if(alt===undefined && b.dataset.v!==teile(SZ.zeilen[Number(k.split("_")[0])][1])[Number(k.split("_")[1])][0]) { st.thF[sz]=(st.thF[sz]||0)+1; } merke(); male(); });
    const an=$("#andere"); if(an) an.onclick=()=>{ st.thSz=null; merke(); male(); }; bind(); }
  async function ende(B, h){ let ok=0, n=0;
    soloAufgaben(B).forEach(A=>{ if(A.typ==="theater"){ const sz=st.thSz; if(!sz) return; const SZ=szeneVon(A,sz); const s=lueckenStand(SZ,[0,1,2,-1],(st.th||{})[sz]||{},true); const f=(st.thF||{})[sz]||0; n+=s.n; ok+=Math.max(0,Math.min(s.ok, s.n-f)); return; }
      const L=itemsVon(A); n+=L.length; ok+=ersteVersuche(A,(st.a||{})[A.id]||{}); });
    const p=n?Math.round(ok/n*10):0; st["p_"+B.id]=p; merke();
    app.innerHTML=h+`<div class="card fertig"><div class="e">🏁</div><h2>${esc(B.titel)}: fertig!</h2><p><b>${ok} von ${n}</b> beim ersten Versuch richtig.</p><div id="lwmeld" class="muted">Speichern …</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="zurueck2">Zur Übersicht</button><button class="btn ghost" id="nochmalB">↺ Thema noch einmal</button></div></div></div>`;
    $("#zurueck2").onclick=uebersicht; $("#nochmalB").onclick=()=>{ B.aufgaben.forEach(A=>{ if(st.a) delete st.a[A.id]; }); if(B.id==="theater"){ st.th={}; st.thF={}; st.thSz=null; } merke(); pos.s=0; male(); };
    const z=$("#zurueck"); if(z) z.onclick=uebersicht;
    const m=$("#lwmeld"); if(!window.LW){ m.textContent=""; return; } try{ if(window.LW && LW.ich()){ const r=await LW.speichern({key:`${PLAN.id}-${B.id}`, titel:`Wiederholung: ${B.titel}`, p, max:10}); m.textContent=r.ok?`✓ ${p} von 10 Punkten in der Lernwelt gespeichert.`:r.wartet?"Offline – die Punkte werden später gesendet.":""; } else m.innerHTML=`Melde dich in der <a href="index.html">Lernwelt</a> an, dann werden deine Punkte gespeichert.`; }catch(e){ m.textContent=""; } }
  const b0=P.get("block"); if(b0){ const bi=PLAN.bloecke.findIndex(B=>B.id===b0); if(bi>=0){ pos={b:bi, s:0}; return male(); } } uebersicht();
}

if(P.get("solo")) solo(); else if(!db) app.innerHTML=`<div class="wrap"><div class="card">Keine Verbindung. Bitte Seite neu laden.</div></div>`; else if(P.get("leitung")) leitung(); else handy();
</script>
