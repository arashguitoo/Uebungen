<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Lernstand – Übungszentrale</title>
<link rel="stylesheet" href="stil.css?v=20261016a">
<style>
  :root{--akzent:#5b4fa3;--akzent-hell:#ecebf7}
  .nachricht{background:linear-gradient(135deg,#5b4fa3,#2f6fc4);color:#fff;border-radius:var(--r);padding:16px 18px;margin-top:16px}
  .nachricht p{margin:6px 0 0;white-space:pre-line}
  .abschn{margin:26px 0 8px}
  .listen{display:grid;gap:14px}
  .liste-k h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .balken{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin:4px 0 10px}
  .balken i{display:block;height:100%;background:linear-gradient(90deg,#5b4fa3,#2e9e5b)}
  .pkt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--linie)}
  .wert{display:inline-block;border-radius:8px;padding:2px 9px;font-weight:700;font-size:.85rem;white-space:nowrap}
  .wert.leer{color:#aaa;background:#f4f4f4}
  .mk{display:inline-block;border-radius:99px;padding:3px 11px;margin:3px 3px 0 0;font-size:.9rem;font-weight:600}
  .mk.s{background:#d9f2e2;color:#1d7a45}.mk.w{background:#fbe0db;color:#b3402f}
  .zwei{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.zwei{grid-template-columns:1fr}}
  .zwei p{white-space:pre-line;margin:8px 0 0}
  .thema{display:grid;gap:8px}
  .thema .tt{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{font:inherit;font-weight:600;font-size:.92rem;border:1.5px solid var(--linie);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;min-height:40px}
  .leit{font-size:.92rem;color:#444;background:#f7f6fb;border-radius:9px;padding:8px 10px}
  .uhr{position:fixed;inset:0;background:rgba(20,18,40,.93);color:#fff;z-index:60;display:grid;place-items:center;padding:20px;text-align:center}
  .uhr .z{font-size:5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .uhr ul{text-align:left;max-width:520px;margin:18px auto;font-size:1.1rem;line-height:1.6}
</style>
</head>
<body>
<div id="demo"></div>
<header class="kopf"><div class="wrap"><a href="index.html" id="zur">← Zentrale</a><div class="titel">📋 Mein Lernstand</div><div class="wer" id="wer"></div></div></header>
<main class="wrap" id="app"><p class="leise">Lädt …</p></main>
<script type="module">
import { db, DEMO, esc, mitDemo } from './db.js?v=20261016a';
import { exById } from './katalog.js?v=20261016a';
import { sitzung, anmelden } from './spieler.js?v=20261016a';
import { LISTEN, MERKMAL, wertInfo, skalaVon, prozent } from './feedback-kriterien.js?v=20261016a';

if (DEMO) document.getElementById('demo').innerHTML = '<div class="demo-band">DEMO-MODUS – Daten bleiben nur in diesem Browser</div>';
document.getElementById('zur').href = mitDemo('index.html');
const $ = s => document.querySelector(s), app = $('#app');
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) { try { await anmelden(urlCode); } catch (e) { } history.replaceState(null, '', location.pathname + (DEMO ? '?demo' : '')); }
const s = sitzung();
const fehler = e => { app.innerHTML = `<div class="karte" style="margin-top:24px;border-color:#f1c6be;background:#fbe9e6"><h2>Dein Lernstand kann gerade nicht geladen werden</h2><p>Bitte versuche es später noch einmal.</p><p class="klein leise">Technische Meldung: ${esc(e && (e.code || e.message) || e)} – für die Lehrkraft: Sind die Datenbankregeln für „mein“ und „selbst“ eingetragen?</p></div>`; };
let mein = {}, selbst = {};

if (!s || !s.code) {
  app.innerHTML = `<div class="karte" style="margin-top:24px;text-align:center"><h2>Bitte mit deinem Code anmelden</h2><p class="leise">Deinen Lernstand siehst du nur, wenn du mit deinem persönlichen Code angemeldet bist.</p><a class="btn" href="${mitDemo('index.html')}">Zur Anmeldung</a></div>`;
} else {
  $('#wer').textContent = '👤 ' + s.name;
  db.listen('mein/' + s.code, v => { mein = v || {}; zeige(); }, fehler);
  db.listen('selbst/' + s.code, v => { selbst = v || {}; zeige(); }, () => { });
}

const wertHtml = (L, v) => { const w = wertInfo(L, v); return w ? `<span class="wert" style="background:${w.c};color:${w.f}">${esc(w.l)}</span>` : '<span class="wert leer">noch offen</span>'; };

function zeige() {
  const fb = mein.fb, c = (fb && fb.c) || {}, m = (fb && fb.m) || {};
  let h = '';
  if (!fb && !mein.sa) { app.innerHTML = `<div class="karte" style="margin-top:24px"><h2>Noch kein Feedback</h2><p class="leise">Sobald dein Lehrer dein Feedback veröffentlicht oder die Selbsteinschätzung öffnet, siehst du es hier.</p></div>`; return; }
  if (fb) {
    h += `<div class="nachricht"><b>Hallo ${esc(s.name)}!</b> <span class="klein" style="opacity:.85">· Feedback vom ${new Date(fb.t).toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' })}</span>${fb.msg ? `<p>${esc(fb.msg)}</p>` : '<p>Hier siehst du, wie weit du mit der Vorbereitung auf die Prüfung DTB B2 bist.</p>'}</div>`;
    const st = Object.keys(m).filter(k => m[k] === 's'), sw = Object.keys(m).filter(k => m[k] === 'w');
    if (st.length || sw.length || fb.st || fb.sw || fb.ziel) {
      h += `<h2 class="abschn">Stärken und nächste Schritte</h2><div class="zwei">
        <div class="karte"><h3>💪 Das kannst du gut</h3>${st.map(k => `<span class="mk s">${esc(MERKMAL[k] || k)}</span>`).join('')}${fb.st ? `<p>${esc(fb.st)}</p>` : ''}${!st.length && !fb.st ? '<p class="leise">–</p>' : ''}</div>
        <div class="karte"><h3>🎯 Daran arbeitest du</h3>${sw.map(k => `<span class="mk w">${esc(MERKMAL[k] || k)}</span>`).join('')}${fb.sw ? `<p>${esc(fb.sw)}</p>` : ''}${!sw.length && !fb.sw ? '<p class="leise">–</p>' : ''}</div></div>
        ${fb.ziel ? `<div class="karte" style="margin-top:14px"><h3>🗓 Nächste Schritte</h3><p style="white-space:pre-line;margin:0">${esc(fb.ziel)}</p></div>` : ''}`;
    }
  }
  // Selbsteinschätzung / Teil 1A
  if (mein.sa) for (const L of LISTEN.filter(l => l.selbst)) {
    h += `<h2 class="abschn">${esc(L.titel)}</h2><p class="leise" style="margin-top:0">${esc(L.info || '')} <b>Wie gut bist du vorbereitet?</b> Klicke deine Einschätzung an – dein Lehrer sieht sie.</p><div class="listen">`;
    h += L.items.map(it => { const key = L.id + '_' + it.id, sv = (selbst[key] || {}).s, lv = c[key];
      return `<div class="karte thema"><div class="tt"><h3 style="margin:0">${esc(it.t)}</h3>${fb ? `<span class="klein leise">Lehrer: ${wertHtml(L, lv)}</span>` : ''}</div>
        ${it.h ? `<div class="leit"><b>Darüber kannst du sprechen:</b> ${esc(it.h)}</div>` : ''}
        <div class="zeile"><div class="seg">${skalaVon(L).werte.map(w => `<button data-key="${key}" data-v="${w.v}" style="${sv === w.v ? `background:${w.c};color:${w.f};border-color:${w.f}` : ''}">${esc(w.l)}</button>`).join('')}</div>
          <span style="flex:1"></span><button class="btn zweit klein" data-uhr="${key}">⏱ 2 Minuten üben</button></div></div>`; }).join('') + '</div>';
  }
  if (fb) {
    const ls = LISTEN.filter(l => l.tn && !(mein.sa && l.selbst) && l.items.some(it => c[l.id + '_' + it.id]));
    if (ls.length) h += `<h2 class="abschn">Prüfungsteile und Kriterien</h2><div class="listen">${ls.map(L => { const pr = prozent(L, Object.fromEntries(Object.entries(c).map(([k, v]) => [k, { s: v }])));
      return `<div class="karte liste-k"><h3><span>${esc(L.titel)}</span><span class="klein leise">${pr} %</span></h3><div class="balken"><i style="width:${pr}%"></i></div>
        ${L.items.map(it => { const ex = it.ex && exById(it.ex); return `<div class="pkt"><span>${esc(it.t)}${ex ? ` · <a href="${mitDemo(ex.datei)}" class="klein">üben →</a>` : ''}</span>${wertHtml(L, c[L.id + '_' + it.id])}</div>`; }).join('')}</div>`; }).join('')}</div>`;
  }
  app.innerHTML = h;
  app.querySelectorAll('.seg button').forEach(b => b.onclick = async () => {
    const key = b.dataset.key, v = +b.dataset.v, alt = (selbst[key] || {}).s;
    try { await db.set('selbst/' + s.code + '/' + key, alt === v ? null : { s: v, t: Date.now() }); } catch (e) { alert('Konnte nicht gespeichert werden. Bitte später noch einmal versuchen.'); }
  });
  app.querySelectorAll('[data-uhr]').forEach(b => b.onclick = () => uhr(b.dataset.uhr));
}

function uhr(key) {
  const [lid, iid] = key.split('_'), L = LISTEN.find(l => l.id === lid), it = L.items.find(i => i.id === iid);
  const d = document.createElement('div'); d.className = 'uhr';
  let rest = 120, lauf = null;
  d.innerHTML = `<div><div class="klein" style="opacity:.8">Sprechen Teil 1A · ohne Notizen</div><h2 style="font-size:1.8rem;margin:6px 0 14px">${esc(it.t)}</h2>
    <div class="z" id="uz">2:00</div><ul>${(it.h || '').split(' · ').map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <div class="zeile" style="justify-content:center"><button class="btn" id="ugo">▶ Start</button><button class="btn zweit" id="uzu">Schließen</button></div>
    <p class="klein" style="opacity:.75;margin-top:14px">Tipp: Sprich laut und nimm dich mit dem Handy auf. Unter 1 Minute? Dann brauchst du mehr Beispiele und Begründungen.</p></div>`;
  document.body.append(d);
  const z = d.querySelector('#uz'), zeig = () => z.textContent = Math.floor(rest / 60) + ':' + String(rest % 60).padStart(2, '0');
  d.querySelector('#ugo').onclick = e => { if (lauf) { clearInterval(lauf); lauf = null; e.target.textContent = '▶ Weiter'; return; }
    e.target.textContent = '⏸ Pause'; lauf = setInterval(() => { rest--; zeig(); if (rest <= 0) { clearInterval(lauf); lauf = null; z.textContent = '✓ 2 Minuten!'; e.target.textContent = 'Fertig'; e.target.disabled = true; } }, 1000); };
  d.querySelector('#uzu').onclick = () => { clearInterval(lauf); d.remove(); };
}
</script>
</body>
</html>
