<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Lernstand – Übungszentrale</title>
<link rel="stylesheet" href="stil.css?v=20261016a">
<style>
  :root{--tinte:#26324a;--tinte2:#3a4a6b;--akzent:#3f5f9a;--akzent-hell:#eaf0f8;--warm:#f6f3ee;--gruen:#2f7d57;--gruen-hell:#e4f3ea;--rot:#b4553f;--rot-hell:#fbece7;--gelb:#9a6b12;--gelb-hell:#fbf1d9}
  body{background:var(--warm)}
  .kopf{background:var(--tinte)}
  .held{background:linear-gradient(160deg,var(--tinte) 0%,var(--tinte2) 100%);color:#fff;padding:28px 0 64px}
  .held .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .held h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.01em}
  .held p{margin:0;opacity:.82}
  .held .txt{flex:1;min-width:220px}
  .ring{position:relative;width:112px;height:112px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .zahl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
  .ring .zahl b{font-size:1.6rem}.ring .zahl span{font-size:.72rem;opacity:.8;display:block}
  main.wrap{margin-top:-44px;padding-bottom:40px}
  .karte{border-radius:16px;border-color:#e6e0d6}
  .brief{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-left:5px solid var(--akzent)}
  .brief .ava{width:46px;height:46px;border-radius:50%;background:var(--akzent-hell);display:grid;place-items:center;font-size:1.4rem}
  .brief p{margin:6px 0 0;white-space:pre-line;font-size:1.05rem}
  .brief .von{font-size:.85rem;color:var(--leise)}
  .abschn{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 4px}
  .abschn h2{margin:0;font-size:1.35rem;color:var(--tinte)}
  .unter{color:var(--leise);margin:2px 0 14px;max-width:680px}
  .zwei{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:680px){.zwei{grid-template-columns:1fr}}
  .feld h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:1.05rem}
  .feld p{white-space:pre-line;margin:10px 0 0}
  .marke{display:inline-block;border-radius:99px;padding:4px 12px;margin:0 6px 6px 0;font-size:.9rem;font-weight:600}
  .marke.s{background:var(--gruen-hell);color:var(--gruen)}.marke.w{background:var(--rot-hell);color:var(--rot)}
  .schritte{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:8px}
  .schritte li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
  .schritte li::before{content:'';width:18px;height:18px;border:2px solid var(--akzent);border-radius:6px;margin-top:3px}
  .themen{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}
  @media(max-width:440px){.themen{grid-template-columns:1fr}}
  .thema{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
  .thema .kopfz{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
  .nr{width:34px;height:34px;border-radius:10px;background:var(--akzent-hell);color:var(--akzent);display:grid;place-items:center;font-weight:700}
  .thema.fertig .nr{background:var(--gruen);color:#fff}
  .thema h3{margin:0;font-size:1.05rem;line-height:1.3}
  .lehrer{font-size:.82rem;color:var(--leise);margin-top:3px}
  details{border-radius:10px;background:#f8f6f2;padding:8px 12px;font-size:.93rem}
  details summary{cursor:pointer;font-weight:600;color:var(--tinte2);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:'▸ ';color:var(--akzent)}details[open] summary::before{content:'▾ '}
  details ul{margin:8px 0 2px;padding-left:20px}
  .frage{font-size:.82rem;font-weight:600;color:var(--leise);margin:0 0 6px}
  .stufen{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .stufen button{font:inherit;font-size:.9rem;font-weight:600;border:1.5px solid #e1dbd0;background:#fff;color:#555;border-radius:10px;padding:8px 6px;cursor:pointer;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s,border-color .15s}
  .stufen button i{font-style:normal;display:flex;gap:3px;margin-bottom:2px}
  .stufen .p{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}.stufen .p.an{background:currentColor;opacity:1}
  .stufen button:hover{border-color:var(--akzent)}
  .unten{display:flex;justify-content:flex-end}
  .lnk{background:none;border:0;font:inherit;font-weight:600;color:var(--akzent);cursor:pointer;padding:4px 0}
  .pill{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:.8rem;white-space:nowrap}
  .pill.leer{color:#9a948a;background:#f0ede7}
  .teile{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}
  @media(max-width:440px){.teile{grid-template-columns:1fr}}
  .teil .kopfz{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .teil h3{margin:0;flex:1;font-size:1.05rem}
  .zeilen{display:grid}
  .zl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #efe9df;font-size:.95rem}
  .zl a{font-size:.85rem;font-weight:600;text-decoration:none;margin-left:6px}
  .legende{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--leise)}
  .leer-k{text-align:center;padding:34px 22px}
  .leer-k .ic{font-size:2.6rem}
  .fuss{text-align:center;margin-top:30px;color:var(--leise);font-size:.85rem}
  .uhr{position:fixed;inset:0;background:rgba(26,32,48,.95);color:#fff;z-index:60;display:grid;place-items:center;padding:20px;text-align:center}
  .uhr .z{font-size:5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .uhr ul{text-align:left;max-width:520px;margin:18px auto;font-size:1.1rem;line-height:1.6}
  .uhr .btn{background:#fff;color:var(--tinte);border-color:#fff}.uhr .btn.zweit{background:transparent;color:#fff}
  .gespeichert{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tinte);color:#fff;padding:9px 16px;border-radius:10px;font-size:.92rem;z-index:70}
</style>
</head>
<body>
<div id="demo"></div>
<header class="kopf"><div class="wrap"><a href="index.html" id="zur">← Übungszentrale</a><div class="titel"></div><div class="wer" id="wer"></div></div></header>
<section class="held"><div class="wrap" id="held"><div class="txt"><h1>Mein Lernstand</h1><p>Lädt …</p></div></div></section>
<main class="wrap" id="app"></main>
<script type="module">
import { db, DEMO, esc, mitDemo } from './db.js?v=20261016a';
import { exById } from './katalog.js?v=20261016a';
import { sitzung, anmelden } from './spieler.js?v=20261016a';
import { LISTEN, MERKMAL, wertInfo, skalaVon, prozent } from './feedback-kriterien.js?v=20261016a';

if (DEMO) document.getElementById('demo').innerHTML = '<div class="demo-band">DEMO-MODUS – Daten bleiben nur in diesem Browser</div>';
document.getElementById('zur').href = mitDemo('index.html');
const $ = s => document.querySelector(s), app = $('#app'), held = $('#held');
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) { try { await anmelden(urlCode); } catch (e) { } history.replaceState(null, '', location.pathname + (DEMO ? '?demo' : '')); }
const s = sitzung();
let mein = {}, selbst = {};
const datumLang = t => new Date(t).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });

function ring(pct, farbe = '#fff', hinter = 'rgba(255,255,255,.18)', unter = 'vorbereitet', gr = 112) {
  const r = gr / 2 - 8, u = 2 * Math.PI * r;
  return `<div class="ring" style="width:${gr}px;height:${gr}px"><svg width="${gr}" height="${gr}"><circle cx="${gr / 2}" cy="${gr / 2}" r="${r}" fill="none" stroke="${hinter}" stroke-width="9"/>
    <circle cx="${gr / 2}" cy="${gr / 2}" r="${r}" fill="none" stroke="${farbe}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${u}" stroke-dashoffset="${u * (1 - pct / 100)}"/></svg>
    <div class="zahl"><div><b ${gr < 90 ? 'style="font-size:1.05rem"' : ''}>${pct} %</b>${unter ? `<span>${unter}</span>` : ''}</div></div></div>`;
}
function heldZeigen(text, pct) {
  held.innerHTML = `<div class="txt"><h1>${s ? 'Hallo ' + esc(s.name) + '!' : 'Mein Lernstand'}</h1><p>${text}</p></div>${pct != null ? ring(pct) : ''}`;
}
const pill = (L, v) => { const w = wertInfo(L, v); return w ? `<span class="pill" style="background:${w.c};color:${w.f}">${esc(w.l)}</span>` : '<span class="pill leer">noch offen</span>'; };
const STUFE_IC = { 1: '<b class="p an"></b><b class="p"></b><b class="p"></b>', 2: '<b class="p an"></b><b class="p an"></b><b class="p"></b>', 3: '<b class="p an"></b><b class="p an"></b><b class="p an"></b>' };

if (!s || !s.code) {
  heldZeigen('Deinen persönlichen Lernstand siehst du, wenn du mit deinem Code angemeldet bist.');
  app.innerHTML = `<div class="karte leer-k"><div class="ic">🔑</div><h2>Bitte mit deinem Code anmelden</h2><p class="leise">Den Code hast du von deiner Lehrkraft bekommen.</p><a class="btn" href="${mitDemo('index.html')}">Zur Anmeldung</a></div>`;
} else {
  $('#wer').textContent = s.name + (s.kurs ? ' · ' + s.kurs : '');
  db.listen('mein/' + s.code, v => { mein = v || {}; zeige(); }, e => {
    heldZeigen('Dein Lernstand kann gerade nicht geladen werden.');
    app.innerHTML = `<div class="karte leer-k"><div class="ic">⏳</div><h2>Gerade keine Verbindung</h2><p class="leise">Bitte versuche es in ein paar Minuten noch einmal.</p><p class="klein leise">Technische Meldung: ${esc(e && (e.code || e.message) || e)}</p></div>`; });
  db.listen('selbst/' + s.code, v => { selbst = v || {}; zeige(); }, () => { });
}

function zeige() {
  const fb = mein.fb, c = (fb && fb.c) || {}, m = (fb && fb.m) || {};
  const cs = Object.fromEntries(Object.entries(c).map(([k, v]) => [k, { s: v }]));
  if (!fb && !mein.sa) {
    heldZeigen('Hier findest du bald dein persönliches Feedback und deinen Vorbereitungsstand für die Prüfung DTB B2.');
    app.innerHTML = `<div class="karte leer-k"><div class="ic">🌱</div><h2>Noch kein Feedback</h2><p class="leise" style="max-width:460px;margin:0 auto 16px">Sobald deine Lehrkraft dein Feedback freigibt oder die Selbsteinschätzung öffnet, erscheint es hier. Bis dahin: einfach weiter üben!</p><a class="btn zweit" href="${mitDemo('index.html')}">Zu den Übungen</a></div>`;
    return;
  }
  const sichtbar = LISTEN.filter(L => L.tn && L.items.some(it => c[L.id + '_' + it.id]));
  const gesamt = sichtbar.length ? Math.round(sichtbar.reduce((a, L) => a + prozent(L, cs), 0) / sichtbar.length) : null;
  heldZeigen(fb ? `Dein Weg zur Prüfung DTB B2 · Feedback vom ${datumLang(fb.t)}` : 'Dein Weg zur Prüfung DTB B2 – schätze dich selbst ein.', gesamt);
  let h = '';
  if (fb) {
    h += `<div class="karte brief"><div class="ava">✉️</div><div><div class="von">Nachricht deiner Lehrkraft</div>
      <p>${fb.msg ? esc(fb.msg) : 'Hier siehst du, was du schon gut kannst und woran du als Nächstes arbeitest. Schau regelmäßig vorbei – dein Lernstand wird laufend aktualisiert.'}</p></div></div>`;
    const st = Object.keys(m).filter(k => m[k] === 's'), sw = Object.keys(m).filter(k => m[k] === 'w');
    if (st.length || sw.length || fb.st || fb.sw) h += `<div class="abschn"><h2>Stärken und Ziele</h2></div><p class="unter">Was dir schon gut gelingt – und worauf du dich jetzt konzentrierst.</p>
      <div class="zwei"><div class="karte feld"><h3>💪 Das kannst du schon gut</h3>${st.map(k => `<span class="marke s">${esc(MERKMAL[k] || k)}</span>`).join('')}${fb.st ? `<p>${esc(fb.st)}</p>` : ''}${!st.length && !fb.st ? '<p class="leise">Folgt beim nächsten Feedback.</p>' : ''}</div>
        <div class="karte feld"><h3>🎯 Daran arbeitest du</h3>${sw.map(k => `<span class="marke w">${esc(MERKMAL[k] || k)}</span>`).join('')}${fb.sw ? `<p>${esc(fb.sw)}</p>` : ''}${!sw.length && !fb.sw ? '<p class="leise">Folgt beim nächsten Feedback.</p>' : ''}</div></div>`;
    if (fb.ziel) { const zeilen = fb.ziel.split(/\n+/).map(z => z.replace(/^[-–•*]\s*/, '').trim()).filter(Boolean);
      h += `<div class="karte feld" style="margin-top:14px"><h3>🗓 Deine nächsten Schritte</h3><ul class="schritte">${zeilen.map(z => `<li><span>${esc(z)}</span></li>`).join('')}</ul></div>`; }
  }
  if (mein.sa) for (const L of LISTEN.filter(l => l.selbst)) {
    const n = L.items.filter(it => (selbst[L.id + '_' + it.id] || {}).s === 3).length;
    h += `<div class="abschn"><h2>${esc(L.titel)}</h2><span class="leise klein">${n} von ${L.items.length} Themen prüfungsreif (deine Einschätzung)</span></div>
      <p class="unter">${esc(L.info || '')} Schätze dich ehrlich ein – deine Lehrkraft sieht deine Einschätzung und kann dich gezielt unterstützen.</p><div class="themen">`;
    h += L.items.map((it, i) => { const key = L.id + '_' + it.id, sv = (selbst[key] || {}).s, lv = c[key];
      return `<div class="karte thema ${sv === 3 ? 'fertig' : ''}"><div class="kopfz"><div class="nr">${sv === 3 ? '✓' : i + 1}</div><div><h3>${esc(it.t)}</h3>${fb ? `<div class="lehrer">Lehrkraft: ${pill(L, lv)}</div>` : ''}</div></div>
        ${it.h ? `<details><summary>Worüber kann ich sprechen?</summary><ul>${it.h.split(' · ').map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
        <div><div class="frage">Wie sicher fühlst du dich?</div><div class="stufen">${skalaVon(L).werte.map(w => `<button data-key="${key}" data-v="${w.v}" aria-pressed="${sv === w.v}" style="${sv === w.v ? `background:${w.c};color:${w.f};border-color:${w.f}` : ''}"><i>${STUFE_IC[w.v] || ''}</i>${esc(w.l)}</button>`).join('')}</div></div>
        <div class="unten"><button class="lnk" data-uhr="${key}">⏱ 2 Minuten frei sprechen üben</button></div></div>`; }).join('') + '</div>';
  }
  const teile = sichtbar.filter(L => !(mein.sa && L.selbst));
  if (fb && teile.length) {
    h += `<div class="abschn"><h2>Prüfungsteile und Kriterien</h2></div><p class="unter">So schätzt deine Lehrkraft deinen Stand ein. Mit „üben →“ kommst du direkt zur passenden Übung.</p><div class="teile">`;
    h += teile.map(L => `<div class="karte teil"><div class="kopfz"><h3>${esc(L.titel)}</h3>${ring(prozent(L, cs), 'var(--akzent)', '#e8e3da', '', 64)}</div>
      ${L.info ? `<p class="klein leise" style="margin:0 0 6px">${esc(L.info)}</p>` : ''}<div class="zeilen">${L.items.map(it => { const ex = it.ex && exById(it.ex);
        return `<div class="zl"><span>${esc(it.t)}${ex ? `<a href="${mitDemo(ex.datei)}">üben →</a>` : ''}</span>${pill(L, c[L.id + '_' + it.id])}</div>`; }).join('')}</div></div>`).join('') + '</div>';
    const skalen = [...new Set(teile.map(L => L.skala))];
    if (skalen.includes('abcd')) h += `<p class="legende" style="margin-top:12px">Stufen wie in der Prüfung: ${skalaVon(teile.find(L => L.skala === 'abcd')).werte.map(w => `<span class="pill" style="background:${w.c};color:${w.f}">${esc(w.l)}</span>`).join('')}</p>`;
  }
  h += `<p class="fuss">Fragen zu deinem Feedback? Sprich deine Lehrkraft im Kurs an. · Lern Deutsch mit Arash</p>`;
  app.innerHTML = h;
  app.querySelectorAll('.stufen button').forEach(b => b.onclick = async () => {
    const key = b.dataset.key, v = +b.dataset.v, alt = (selbst[key] || {}).s;
    try { await db.set('selbst/' + s.code + '/' + key, alt === v ? null : { s: v, t: Date.now() }); hinweis('Gespeichert ✓'); }
    catch (e) { hinweis('Konnte nicht gespeichert werden – bitte später noch einmal versuchen.'); }
  });
  app.querySelectorAll('[data-uhr]').forEach(b => b.onclick = () => uhr(b.dataset.uhr));
}
function hinweis(t) { document.querySelectorAll('.gespeichert').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'gespeichert'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 1800); }

function uhr(key) {
  const [lid, iid] = key.split('_'), L = LISTEN.find(l => l.id === lid), it = L.items.find(i => i.id === iid);
  const d = document.createElement('div'); d.className = 'uhr';
  let rest = 120, lauf = null;
  d.innerHTML = `<div><div class="klein" style="opacity:.75">Sprechen Teil 1A · ohne Notizen</div><h2 style="font-size:1.8rem;margin:6px 0 14px">${esc(it.t)}</h2>
    <div class="z" id="uz">2:00</div><ul>${(it.h || '').split(' · ').map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <div class="zeile" style="justify-content:center"><button class="btn" id="ugo">▶ Start</button><button class="btn zweit" id="uzu">Schließen</button></div>
    <p class="klein" style="opacity:.7;margin-top:14px">Tipp: Sprich laut und nimm dich mit dem Handy auf. Nach weniger als einer Minute fertig? Dann ergänze Beispiele und Begründungen.</p></div>`;
  document.body.append(d);
  const z = d.querySelector('#uz'), zeig = () => z.textContent = Math.floor(rest / 60) + ':' + String(rest % 60).padStart(2, '0');
  d.querySelector('#ugo').onclick = e => { if (lauf) { clearInterval(lauf); lauf = null; e.target.textContent = '▶ Weiter'; return; }
    e.target.textContent = '⏸ Pause'; lauf = setInterval(() => { rest--; zeig(); if (rest <= 0) { clearInterval(lauf); lauf = null; z.textContent = '✓ Geschafft!'; e.target.textContent = 'Fertig'; e.target.disabled = true; } }, 1000); };
  d.querySelector('#uzu').onclick = () => { clearInterval(lauf); d.remove(); };
}
</script>
</body>
</html>
