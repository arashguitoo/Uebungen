<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemeinsam ein Problem lösen – Übungszentrale</title>
<link rel="stylesheet" href="stil.css?v=20261008a">
<style>
  :root{--akzent:#2f6b5e;--akzent-hell:#e6f1ee}
  body{background:#eef2f0}
  .start{padding:24px 18px}
  .start h1{font-family:Georgia,serif;font-size:2rem;color:var(--akzent);margin:6px 0}
  .format{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .format div{background:#f6faf8;border:1px solid var(--linie);border-radius:12px;padding:10px 12px;font-size:.92rem}
  .format b{display:block;color:var(--akzent);font-size:1.05rem}
  .knopfreihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .filter{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
  .chip{font:inherit;font-size:.88rem;border:1px solid var(--linie);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer}
  .chip.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}
  .sliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .skarte{font:inherit;text-align:left;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
  .skarte:hover{border-color:var(--akzent)}
  .skarte .ic{font-size:1.5rem;grid-row:span 2}
  .skarte b{font-size:1rem}
  .skarte .leise{font-size:.82rem}
  .skarte .ok{color:var(--ok);font-weight:700;font-size:.82rem}
  /* Prüfungsblatt */
  .blatt{background:#fffefa;border:1px solid #d9d4c7;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:20px 22px;position:relative}
  .blatt .kennung{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e6e0d2;padding-bottom:6px;margin-bottom:12px}
  .blatt h2{font-family:Georgia,serif;margin:0 0 8px;color:var(--akzent)}
  .blatt .sit{font-size:1.04rem}
  .blatt .auf{font-style:italic;color:#444;margin:10px 0}
  .blatt ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
  .blatt li{background:#f4f8f6;border-left:4px solid var(--akzent);padding:6px 10px;border-radius:4px}
  .rollen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .rolle{border:1px dashed var(--akzent);border-radius:10px;padding:10px;background:#fff;font-size:.94rem}
  .rolle b{color:var(--akzent)}
  @media(max-width:560px){.rollen{grid-template-columns:1fr}}
  details.ideen{margin-top:12px;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:8px 12px}
  details.ideen summary{cursor:pointer;font-weight:600;color:var(--akzent)}
  details.ideen ul{margin:8px 0 2px;padding-left:20px}
  /* Gespräch */
  .uhr{font-family:Consolas,"Courier New",monospace;font-size:3.6rem;font-weight:700;text-align:center;color:var(--akzent);line-height:1;margin:6px 0}
  .uhr.knapp{color:#c0622b}.uhr.aus{color:var(--fehler)}
  .uhrbalken{height:8px;background:#dfe7e3;border-radius:8px;overflow:hidden;margin:6px 0 14px}
  .uhrbalken i{display:block;height:100%;background:var(--akzent);transition:width .9s linear}
  .phasen{display:grid;gap:6px;margin:10px 0}
  .phase{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;border-radius:10px;border:1px solid var(--linie);background:#fff;opacity:.55}
  .phase.jetzt{opacity:1;border-color:var(--akzent);background:var(--akzent-hell)}
  .phase.vorbei{opacity:.8}
  .phase .n{font-weight:700;color:var(--akzent)}
  .phase .rm{grid-column:2;font-size:.86rem;color:#555}
  .mini{font-size:.92rem;background:#fffefa;border:1px solid #e6e0d2;border-radius:10px;padding:10px 12px}
  .mini ul{margin:4px 0 0;padding-left:18px}
  /* Checkliste */
  .check{display:grid;gap:8px}
  .ck{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--linie);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left}
  .ck.an{border-color:var(--ok);background:var(--ok-hell)}
  .ck .box{width:22px;height:22px;border-radius:6px;border:2px solid #aaa;flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
  .ck.an .box{background:var(--ok);border-color:var(--ok)}
  .fbalken{height:8px;background:#dfe7e3;border-radius:8px;overflow:hidden}.fbalken i{display:block;height:100%;background:var(--akzent);transition:width .3s}
  .ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:10px auto;font-size:1.6rem;font-weight:700}
  .rmtab h3{margin:14px 0 4px;color:var(--akzent)}
  .rmtab ul{margin:0;padding-left:18px}
  @media (max-width:520px){#raus .lang{display:none}.uhr{font-size:3rem}}
</style>

<script>
/* Wächter: zeigt eine verständliche Meldung statt einer leeren Seite */
window.__ok = false;
(function () {
  function zeige(msg) {
    msg = String(msg || 'unbekannter Fehler');
    var fb = /firebase|gstatic/i.test(msg);
    var ziel = document.getElementById('app') || document.body;
    ziel.innerHTML = '<div class="karte" style="max-width:580px;margin:40px auto;border-color:#f1c6be;background:#fbe9e6">' +
      '<h2>Die Seite konnte nicht geladen werden</h2>' +
      (fb ? '<p>Die Verbindung zu Firebase hat nicht geklappt. Bitte prüfe die Internetverbindung und schalte einen Werbeblocker für diese Seite aus.</p>'
          : '<p>Bitte lade die Seite einmal komplett neu: Windows <b>Strg + F5</b>, Mac <b>Cmd + Shift + R</b>.</p>') +
      '<p style="font-size:.85rem;color:#666">Technische Meldung: ' + msg.replace(/</g, '&lt;') + '</p></div>';
  }
  window.__fehler = zeige;
  addEventListener('error', function (e) { if (!window.__ok) zeige(e.message); });
  addEventListener('unhandledrejection', function (e) { var m = e.reason && e.reason.message || e.reason; if (!window.__ok || /firebase|gstatic/i.test(String(m))) zeige(m); });
  setTimeout(function () { if (!window.__ok) zeige('Die Programmdateien wurden nicht vollständig geladen.'); }, 12000);
})();
</script>
<script type="module">
window.__ok = true;
import { starte, navigation } from './spieler.js?v=20261008a';
import { zeige, mische, punkte, labels } from './aufgaben.js?v=20261008a';
import { esc } from './db.js?v=20261008a';

const app = document.getElementById('app');
const D = await (await fetch('situationen.json', { cache: 'no-cache' })).json();
const S = D.situationen;
const L = await starte('problem-loesen');
if (!L.frei) { L.sperre(app); throw new Error('gesperrt'); }

/* ---------------- Redemittel ---------------- */
const RM = [
  { titel: '1 · Situation klären', zeilen: ['Also, es geht darum, dass …', 'Wenn ich das richtig verstehe, müssen wir …', 'Das Hauptproblem ist meiner Meinung nach …', 'Wir sollten zuerst überlegen, was am dringendsten ist.'] },
  { titel: '2 · Vorschläge machen und begründen', zeilen: ['Ich schlage vor, dass wir …', 'Wie wäre es, wenn wir …?', 'Wir könnten doch …', 'Ich fände es sinnvoll, … – weil …', 'Der Vorteil wäre, dass …'] },
  { titel: '3 · Auf den Partner reagieren', zeilen: ['Das ist eine gute Idee. Außerdem könnten wir …', 'Da hast du recht, aber …', 'Ich verstehe deinen Punkt, aber ich sehe das etwas anders: …', 'Ich habe Bedenken, weil …', 'Was hältst du davon, wenn …?'] },
  { titel: '4 · Kompromiss und Aufgaben', zeilen: ['Können wir uns darauf einigen, dass …?', 'Okay, dann machen wir es so: …', 'Ich kümmere mich um …, und du übernimmst …', 'Kurzfristig … und langfristig …'] },
  { titel: '5 · Ergebnis zusammenfassen', zeilen: ['Also, fassen wir zusammen: …', 'Wir haben beschlossen, dass …', 'Als Erstes …, danach …, und zum Schluss …'] }
];
const PHASEN = [
  { bis: 40, n: 'Situation klären', rm: 'Also, es geht darum, dass … · Das Hauptproblem ist …' },
  { bis: 150, n: 'Vorschläge machen, begründen, reagieren', rm: 'Ich schlage vor … · Da hast du recht, aber … · Ich habe Bedenken, weil …' },
  { bis: 210, n: 'Kompromiss finden, Aufgaben verteilen', rm: 'Können wir uns darauf einigen …? · Ich kümmere mich um …, du übernimmst …' },
  { bis: 240, n: 'Ergebnis zusammenfassen', rm: 'Also, fassen wir zusammen: …' }
];
const CHECK = [
  ['ck1', 'Wir haben die Situation und das Hauptproblem kurz zusammengefasst.'],
  ['ck2', 'Jede/r hat mindestens zwei eigene Vorschläge gemacht.'],
  ['ck3', 'Wir haben unsere Vorschläge begründet (weil …, der Vorteil ist …).'],
  ['ck4', 'Wir haben auf die Ideen des Partners reagiert – zugestimmt UND höflich widersprochen.'],
  ['ck5', 'Wir haben mehrere Stichpunkte des Aufgabenblatts besprochen.'],
  ['ck6', 'Wir haben Aufgaben verteilt (Wer macht was? Bis wann?).'],
  ['ck7', 'Wir haben uns geeinigt und das Ergebnis am Ende zusammengefasst.'],
  ['ck8', 'Beide haben ungefähr gleich viel gesprochen.']
];
const TRAIN = [
  { id: 'rt1', typ: 'matrix', kontext: 'Redemittel', frage: 'Wozu passt die Äußerung?', wahl: ['vorschlagen', 'zustimmen', 'widersprechen', 'einigen'], aussagen: [
    ['Wie wäre es, wenn wir Aushilfen einstellen?', 0], ['Wir könnten doch einen Copyshop beauftragen.', 0], ['Das ist eine gute Idee, das machen wir.', 1],
    ['Da bin ich ganz deiner Meinung.', 1], ['Ich verstehe deinen Punkt, aber ich sehe das etwas anders.', 2], ['Ich habe Bedenken, weil das zu teuer ist.', 2],
    ['Können wir uns darauf einigen, dass …?', 3], ['Okay, dann machen wir es so.', 3]] },
  { id: 'rt2', typ: 'mc', kontext: 'Höflich widersprechen', frage: 'Ihr Partner schlägt vor, den Kunden nichts zu sagen. Wie widersprechen Sie am besten?', opts: ['Ich verstehe, warum du das vorschlägst, aber ich finde, wir sollten ehrlich sein.', 'Das ist eine schlechte Idee.', 'Nein. Wir sagen es dem Kunden.', 'Das ist mir egal, mach, was du willst.'], l: 0 },
  { id: 'rt3', typ: 'mc', kontext: 'Begründen', frage: 'Welcher Vorschlag ist begründet?', opts: ['Ich schlage Online-Termine vor, weil das Telefon dann entlastet wird.', 'Ich schlage Online-Termine vor.', 'Online-Termine – das ist modern.', 'Wir machen Online-Termine, fertig.'], l: 0 },
  { id: 'rt4', typ: 'bau', kontext: 'Aufgaben verteilen', frage: 'Bilden Sie den Satz.', steine: ['Ich kümmere mich', 'um die Spedition,', 'und du', 'informierst', 'den Kunden.'] },
  { id: 'rt5', typ: 'mc', kontext: 'Gesprächsführung', frage: 'Was ist im Prüfungsteil „Gemeinsam ein Problem lösen“ besonders wichtig?', opts: ['dass beide Ideen einbringen und am Ende eine gemeinsame Lösung finden', 'dass man möglichst lange allein spricht', 'dass man immer der gleichen Meinung ist wie der Partner', 'dass man alle Stichpunkte nur vorliest'], l: 0 },
  { id: 'rt6', typ: 'zu', kontext: 'Redemittel', frage: 'Was gehört zusammen?', paare: [
    ['Wenn ich das richtig verstehe,', 'müssen wir bis Freitag eine Lösung finden.'],
    ['Der Vorteil wäre,', 'dass niemand Überstunden machen muss.'],
    ['Kurzfristig mieten wir Heizgeräte,', 'langfristig brauchen wir einen Wartungsvertrag.'],
    ['Also, fassen wir zusammen:', 'Du rufst an, ich schreibe die Mail.']] },
  { id: 'rt7', typ: 'mc', kontext: 'Reagieren', frage: 'Ihr Partner sagt lange nichts. Was sagen Sie?', opts: ['Was meinst du dazu? Hast du noch eine andere Idee?', 'Gut, dann entscheide ich alles allein.', 'Warum sagst du nichts?', 'Dann sind wir fertig.'], l: 0 },
  { id: 'rt8', typ: 'bau', kontext: 'Kompromiss', frage: 'Bilden Sie den Satz.', steine: ['Können wir', 'uns darauf', 'einigen,', 'dass', 'zuerst', 'die Kunden', 'informiert werden?'] }
];
const lab = {}; CHECK.forEach(([k, t]) => lab[k] = 'Selbstcheck · ' + t);
TRAIN.forEach(a => Object.entries(labels(a)).forEach(([k, v]) => lab[k] = 'Redemittel · ' + v));
L.registriereItems(lab);

/* ---------------- Zustand ---------------- */
const BK = 'ueb_pl_erledigt';
const erledigt = () => { try { return JSON.parse(localStorage.getItem(BK)) || {}; } catch (e) { return {}; } };
const merke = (id, pct) => { const e = erledigt(); if (!(id in e) || pct > e[id]) { e[id] = pct; try { localStorage.setItem(BK, JSON.stringify(e)); } catch (x) { } } };
let filter = 'Alle', timer = null, laufId = 0, imGespraech = false;
const stopp = () => { clearInterval(timer); timer = null; };
const nav = navigation(L, { zurueck: () => { stopp(); imGespraech = false; startbild(); }, fortschritt: () => imGespraech });
app.addEventListener('click', e => { if (e.target.closest('#raus')) nav.zurStart(); if (e.target.closest('#rmk')) redemittel(); });
const kopf = t => `<div class="zeile" style="margin-bottom:10px"><button class="btn zweit klein" id="raus" title="Zurück zur Übersicht">←<span class="lang"> Übersicht</span></button><b style="flex:1;min-width:0">${t}</b><button class="btn zweit klein" id="rmk" title="Redemittel">💬<span class="lang"> Redemittel</span></button></div>`;

/* ---------------- Startbild ---------------- */
function startbild() {
  laufId++;
  const e = erledigt(), bereiche = ['Alle', ...new Set(S.map(s => s.bereich))];
  const sicht = filter === 'Alle' ? S : S.filter(s => s.bereich === filter);
  app.innerHTML = `<div class="karte start" style="margin-top:14px">
    <span class="pille">B1/B2 · Mündliche Prüfung</span>
    <h1>Gemeinsam ein Problem lösen</h1>
    <p>Prüfungssimulation für den Sprechteil im <b>Deutsch-Test für den Beruf</b>: Sie bekommen zu zweit eine Situation am Arbeitsplatz mit Stichpunkten, sprechen darüber und einigen sich auf eine Lösung.</p>
    <div class="format"><div><b>zu zweit</b>mit einer Partnerin / einem Partner</div><div><b>ca. 4 Minuten</b>Gespräch – mit Zeitanzeige</div><div><b>Stichpunkte</b>als Hilfe auf dem Aufgabenblatt</div><div><b>Ziel</b>Ideen begründen, reagieren, gemeinsam entscheiden</div></div>
    <div class="knopfreihe"><button class="btn" id="zufall">🎲 Prüfungskarte ziehen</button><button class="btn zweit" id="training">🧩 Redemittel-Training</button><button class="btn zweit" id="rmk">💬 Redemittel</button></div>
    <p class="leise klein" style="margin-top:10px">Allein üben? Ziehen Sie eine Karte, lesen Sie die Rollenkarte A und spielen Sie beide Seiten laut – oder nehmen Sie sich mit dem Handy auf.</p></div>
    <div class="filter">${bereiche.map(b => `<button class="chip ${b === filter ? 'an' : ''}" data-b="${esc(b)}">${esc(b)}</button>`).join('')}</div>
    <div class="sliste">${sicht.map(s => `<button class="skarte" data-s="${s.id}"><span class="ic">${s.icon}</span><b>${esc(s.titel)}</b>
      <span class="leise">${esc(s.bereich)}${e[s.id] != null ? ` · <span class="ok">✓ ${e[s.id]} %</span>` : ''}</span></button>`).join('')}</div>
    <p class="leise klein" style="margin-top:12px">${S.length} Situationen · ${Object.keys(e).length} bearbeitet</p>`;
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.b; startbild(); });
  app.querySelectorAll('.skarte').forEach(c => c.onclick = () => karte(S.find(s => s.id === c.dataset.s)));
  document.getElementById('zufall').onclick = () => { const e2 = erledigt(), offen = S.filter(s => !(s.id in e2)); const pool = offen.length ? offen : S; karte(pool[Math.floor(Math.random() * pool.length)]); };
  document.getElementById('training').onclick = training;
  scrollTo(0, 0);
}

/* ---------------- Aufgabenblatt ---------------- */
const blatt = (s, klein = false) => `<div class="blatt aufgabe"><div class="kennung"><span>Sprechen · Gemeinsam ein Problem lösen</span><span>${esc(s.bereich)}</span></div>
  <h2>${s.icon} ${esc(s.titel)}</h2><p class="sit">${esc(s.situation)}</p>
  ${klein ? '' : `<p class="auf">${esc(D.aufgabe)}</p>`}
  <ul>${s.punkte.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;

function karte(s) {
  nav.lauf(); imGespraech = false; stopp();
  app.innerHTML = kopf('Ihr Aufgabenblatt') + blatt(s) + `
    <details class="ideen"><summary>🎭 Rollenkarten (optional – macht die Diskussion lebendiger)</summary>
      <div class="rollen"><div class="rolle"><b>Person A</b><br>${esc(s.rollen.a)}</div><div class="rolle"><b>Person B</b><br>${esc(s.rollen.b)}</div></div>
      <p class="leise klein" style="margin:8px 0 2px">In der echten Prüfung gibt es keine Rollenkarten – hier üben Sie damit, Ihre Meinung zu vertreten und trotzdem einen Kompromiss zu finden.</p></details>
    <div class="knopfreihe" style="justify-content:center"><button class="btn" id="los" style="min-width:230px">▶ Gespräch starten (4 Min.)</button></div>
    <p class="leise klein" style="text-align:center">Lesen Sie das Blatt in Ruhe. Machen Sie sich kurz Notizen: Was ist Ihnen wichtig? Welche Idee haben Sie?</p>`;
  document.getElementById('los').onclick = () => gespraech(s);
  scrollTo(0, 0);
}

/* ---------------- Gespräch mit Zeit ---------------- */
function ton(f = 660, d = .25) { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d); o.start(); o.stop(c.currentTime + d); } catch (e) { } }

function gespraech(s) {
  const ich = ++laufId; imGespraech = true;
  L.beginne(CHECK.length, CHECK.length, 'Situation: ' + s.titel);
  const GES = 240; let t = 0, pause = false;
  app.innerHTML = kopf('Gespräch läuft') + `
    <div class="karte" style="padding:14px 16px"><div class="uhr" id="uhr">4:00</div><div class="uhrbalken"><i id="ub" style="width:100%"></i></div>
      <div class="zeile" style="justify-content:center"><button class="btn zweit klein" id="pz">⏸ Pause</button><button class="btn zweit klein" id="plus">+1 Min.</button><button class="btn klein" id="fertig">✓ Fertig</button></div>
      <div class="phasen">${PHASEN.map((p, i) => `<div class="phase" data-i="${i}"><span class="n">${i + 1}</span><span><b>${p.n}</b></span><span class="rm">${esc(p.rm)}</span></div>`).join('')}</div></div>
    <div class="mini"><b>${s.icon} ${esc(s.titel)}</b> – ${esc(s.situation)}<ul>${s.punkte.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
  let gesamt = GES;
  const male = () => {
    const rest = Math.max(0, gesamt - t), u = document.getElementById('uhr'); if (!u) return;
    u.textContent = Math.floor(rest / 60) + ':' + String(rest % 60).padStart(2, '0');
    u.className = 'uhr' + (rest === 0 ? ' aus' : rest <= 30 ? ' knapp' : '');
    document.getElementById('ub').style.width = (100 * rest / gesamt) + '%';
    const pi = PHASEN.findIndex(p => t < p.bis * gesamt / GES);
    app.querySelectorAll('.phase').forEach((el, i) => el.className = 'phase' + (i === (pi < 0 ? PHASEN.length - 1 : pi) ? ' jetzt' : i < pi || pi < 0 ? ' vorbei' : ''));
  };
  male();
  timer = setInterval(() => {
    if (ich !== laufId || pause) return;
    t++; male();
    if (t === gesamt - 30) ton(520, .2);
    if (t >= gesamt) { stopp(); ton(440, .5); setTimeout(() => ton(440, .5), 600); }
  }, 1000);
  document.getElementById('pz').onclick = e => { pause = !pause; e.target.textContent = pause ? '▶ Weiter' : '⏸ Pause'; };
  document.getElementById('plus').onclick = () => { gesamt += 60; if (!timer) { timer = setInterval(() => { if (ich !== laufId || pause) return; t++; male(); if (t >= gesamt) { stopp(); ton(440, .5); } }, 1000); } male(); };
  document.getElementById('fertig').onclick = () => { stopp(); selbstcheck(s, t); };
  scrollTo(0, 0);
}

/* ---------------- Selbstcheck ---------------- */
function selbstcheck(s, sek) {
  imGespraech = true;
  const an = new Set();
  app.innerHTML = kopf('Selbstcheck') + `<div class="karte aufgabe"><div class="kontext">Wie ist es gelaufen? (${Math.floor(sek / 60)}:${String(sek % 60).padStart(2, '0')} Min. gesprochen)</div>
    <div class="frage">Kreuzen Sie ehrlich an, was Sie geschafft haben.</div>
    <div class="check">${CHECK.map(([k, t]) => `<button class="ck" data-k="${k}"><span class="box"></span><span>${esc(t)}</span></button>`).join('')}</div>
    <button class="btn pruefen-voll" id="ausw">Auswerten</button></div>`;
  app.querySelectorAll('.ck').forEach(b => b.onclick = () => { const k = b.dataset.k; an.has(k) ? an.delete(k) : an.add(k); b.classList.toggle('an'); b.querySelector('.box').textContent = an.has(k) ? '✓' : ''; });
  document.getElementById('ausw').onclick = async () => {
    CHECK.forEach(([k]) => L.antwort(k, an.has(k)));
    imGespraech = false; nav.ende();
    const p = an.size, pct = await L.ende(p, CHECK.length, { situation: s.id, sek });
    merke(s.id, pct);
    auswertung(s, p, pct, CHECK.filter(([k]) => !an.has(k)));
  };
  scrollTo(0, 0);
}

function auswertung(s, p, pct, fehlt) {
  const farbe = pct >= 85 ? 'var(--ok)' : pct >= 60 ? '#5f9e3f' : pct >= 40 ? '#c48a12' : 'var(--fehler)';
  const urteil = pct >= 85 ? 'Prüfungsreif – sehr gut!' : pct >= 60 ? 'Gut – fast alles dabei.' : 'Noch einmal üben lohnt sich.';
  app.innerHTML = kopf('Auswertung') + `<div class="karte aufgabe" style="text-align:center">
    <div class="leise">${s.icon} ${esc(s.titel)}</div>
    <div class="ring" style="background:conic-gradient(${farbe} ${pct * 3.6}deg,#e6e6e6 0)"><div style="background:#fff;width:100px;height:100px;border-radius:50%;display:grid;place-items:center">${pct} %</div></div>
    <p><b>${p} von ${CHECK.length}</b> Punkten · ${urteil}</p>
    ${fehlt.length ? `<div style="text-align:left;max-width:560px;margin:0 auto"><b>Darauf achten Sie beim nächsten Mal:</b><ul>${fehlt.map(([, t]) => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    <details class="ideen" style="text-align:left;max-width:560px;margin:12px auto 0"><summary>💡 Ideen zu dieser Situation vergleichen</summary><ul>${s.ideen.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>
    <div class="knopfreihe" style="justify-content:center"><button class="btn" id="neu">🎲 Nächste Karte</button><button class="btn zweit" id="nochmal">Nochmal mit Partnerwechsel</button><button class="btn zweit" id="raus">Zur Übersicht</button></div></div>`;
  document.getElementById('neu').onclick = () => { const e = erledigt(), offen = S.filter(x => !(x.id in e) && x.id !== s.id); const pool = offen.length ? offen : S.filter(x => x.id !== s.id); karte(pool[Math.floor(Math.random() * pool.length)]); };
  document.getElementById('nochmal').onclick = () => karte(s);
  scrollTo(0, 0);
}

/* ---------------- Redemittel-Training ---------------- */
async function training() {
  nav.lauf(); const ich = ++laufId; imGespraech = false;
  const liste = mische(TRAIN), pm = liste.reduce((x, a) => x + punkte(a), 0);
  let p = 0, pa = 0;
  L.beginne(liste.length, pm, 'Redemittel-Training');
  for (let i = 0; i < liste.length; i++) {
    app.innerHTML = kopf(`Redemittel-Training · ${i + 1} / ${liste.length}`) + `<div class="fbalken"><i style="width:${Math.round(100 * i / liste.length)}%"></i></div><div class="karte" id="feld" style="margin-top:10px"></div>`;
    scrollTo(0, 0);
    await zeige(document.getElementById('feld'), liste[i], { onErgebnis: (ok, d) => { p += d.p; pa += d.pm; imGespraech = true; d.teile.forEach(([id, x]) => L.antwort(id, x)); L.fortschritt(i + 1, p, 'Redemittel-Training', pa); } });
    if (ich !== laufId) return;
  }
  imGespraech = false; nav.ende();
  const pct = await L.ende(p, pm, { teil: 'Redemittel' });
  app.innerHTML = kopf('Redemittel-Training') + `<div class="karte aufgabe" style="text-align:center"><div class="ring" style="background:conic-gradient(var(--akzent) ${pct * 3.6}deg,#e6e6e6 0)"><div style="background:#fff;width:100px;height:100px;border-radius:50%;display:grid;place-items:center">${pct} %</div></div>
    <p><b>${p} von ${pm} Punkten</b></p><div class="knopfreihe" style="justify-content:center"><button class="btn" id="zk">🎲 Jetzt eine Prüfungskarte</button><button class="btn zweit" id="raus">Zur Übersicht</button></div></div>`;
  document.getElementById('zk').onclick = () => karte(S[Math.floor(Math.random() * S.length)]);
}

function redemittel() {
  const d = document.createElement('div'); d.className = 'spick';
  d.innerHTML = `<div class="karte rmtab"><div class="zeile" style="justify-content:space-between"><h2 style="margin:0">💬 Redemittel</h2><button class="btn zweit klein" id="zu">Schließen</button></div>
    ${RM.map(r => `<h3>${esc(r.titel)}</h3><ul>${r.zeilen.map(z => `<li>${esc(z)}</li>`).join('')}</ul>`).join('')}
    <h3>Tipps</h3><ul><li>Nicht nur Stichpunkte vorlesen – eigene Ideen und Beispiele bringen.</li><li>Fragen Sie Ihren Partner nach seiner Meinung und lassen Sie ihn ausreden.</li><li>Widersprechen ist erlaubt – höflich und mit Begründung.</li><li>Am Ende immer: Wer macht was? Und: kurz zusammenfassen.</li></ul></div>`;
  document.body.append(d);
  nav.fenster(d);
}

startbild();
