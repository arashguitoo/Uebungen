  .abt{font-size:.85rem;color:var(--leise);display:flex;justify-content:space-between;margin-bottom:6px}
  .akte{border-left:5px solid var(--akzent);background:#fdfbfd}

  .ersparnis{display:inline-block;margin-top:6px;font-weight:700;color:var(--akzent)}
  .rang{font-family:Georgia,serif;font-size:1.6rem;color:var(--akzent);margin:6px 0}
  .knopfreihe{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

  .formel{background:#fff;border:1px dashed var(--akzent);border-radius:10px;padding:10px;text-align:center;font-weight:600;margin:8px 0}

function ersparnis(a) {

function neuesSpiel() {
  nav.lauf();
  G = { st: 0, richtig: 0, erledigt: 0, gespart: 0, gesamt: STUFEN.length * PRO_STUFE, stufeRichtig: [] };
  G.plan = POOL.map(p => ziehe(p, PRO_STUFE));
  L.beginne(G.gesamt, G.gesamt, 'Abteilung 1: ' + STUFEN[0].name);
  stufeStart();
}

const kopfzeile = () => `<div class="maschine"><button class="btn zweit klein" id="raus" title="Zurück zum Start">←<span class="lang"> Start</span></button><div class="presse" id="presse"><div class="rahmen"></div><div class="stempelk"></div><div class="blatt"></div></div>
  <div class="zaehler"><b id="gespart">${G.gespart}</b><span>Wörter eingespart</span></div><button class="btn zweit klein" id="spick">📒</button></div>
  <div class="stufen">${STUFEN.map((s, i) => `<div class="stufe ${i < G.st ? 'fertig' : i === G.st ? 'jetzt' : ''}" title="${esc(s.name)}"></div>`).join('')}</div>`;

function stufeStart() {
  const s = STUFEN[G.st];
  app.innerHTML = kopfzeile() + `<div class="karte akte aufgabe"><div class="kontext">${esc(s.abt)}</div><h2>${esc(s.name)}</h2><p>${esc(s.text)}</p>
    <button class="btn weiter" id="go">Akten öffnen →</button></div>`;
  document.getElementById('spick').onclick = spickzettel;
  document.getElementById('go').onclick = () => { G.q = G.plan[G.st].slice(); G.nach = []; G.inSt = 0; G.r = 0; naechste(); };
  L.fortschritt(G.erledigt, G.richtig, 'Abteilung ' + (G.st + 1) + ': ' + s.name);
}

async function naechste() {
  const s = STUFEN[G.st];
  if (G.q.length) {
    const a = G.q.shift(); G.inSt++;
    app.innerHTML = kopfzeile() + `<div class="abt"><span>${esc(s.abt)}</span><span>Akte ${G.inSt} / ${PRO_STUFE}</span></div><div class="karte" id="feld"></div>`;
    document.getElementById('spick').onclick = spickzettel;
    await zeige(document.getElementById('feld'), a, { onErgebnis: ok => wertung(a, ok) });
    return naechste();
  }
  if (G.nach.length) {
    const a = G.nach.shift();
    app.innerHTML = kopfzeile() + `<div class="nachl">📂 <b>Wiedervorlage:</b> Diese Akte kommt noch einmal auf deinen Tisch – ohne Punkte, nur zum Üben.</div><div class="karte" id="feld"></div>`;
    document.getElementById('spick').onclick = spickzettel;
    await zeige(document.getElementById('feld'), a, { lobText: 'Akte erledigt!', fehlerText: 'Noch nicht – lies die Lösung genau.' });
    return naechste();
  }
  G.stufeRichtig.push(G.r); G.st++;
  if (G.st < STUFEN.length) zwischen(); else ende();
}

function wertung(a, ok) {
  L.antwort(a.id, ok); G.erledigt++;
  if (ok) {
    G.richtig++; G.r++; const w = ersparnis(a); G.gespart += w;
    const pr = document.getElementById('presse'); if (pr) { pr.classList.add('zu'); setTimeout(() => pr.classList.remove('zu'), 260); }
    const g = document.getElementById('gespart'); if (g) g.textContent = G.gespart;
    const fb = document.querySelector('.feedback.ok b'); if (fb && a.rs) fb.insertAdjacentHTML('afterend', `<span class="ersparnis">⚙️ ${w} Wörter gespart</span>`);
  } else G.nach.push(a);
  L.fortschritt(G.erledigt, G.richtig, 'Abteilung ' + (G.st + 1) + ': ' + STUFEN[G.st].name);
}

function zwischen() {
  const r = G.stufeRichtig.at(-1);
  app.innerHTML = kopfzeile() + `<div class="karte aufgabe" style="text-align:center"><div style="font-size:2.4rem">${r >= 5 ? '🏅' : r >= 3 ? '👍' : '☕'}</div>
    <h2>${esc(STUFEN[G.st - 1].abt)} erledigt</h2><p><b>${r} von ${PRO_STUFE}</b> Akten auf Anhieb richtig.</p>
    <p class="leise">Nächste Station: <b>${esc(STUFEN[G.st].abt)}</b></p><button class="btn weiter" id="go">Weiter →</button></div>`;
  document.getElementById('spick').onclick = spickzettel;
  document.getElementById('go').onclick = stufeStart;
}

async function ende() {
  nav.ende();
  const pct = await L.ende(G.richtig, G.gesamt, { gespart: G.gespart });
  const r = RAENGE.find(x => pct >= x[0]);
  const schwach = G.stufeRichtig.map((n, i) => [n, i]).sort((a, b) => a[0] - b[0])[0];
  app.innerHTML = kopfzeile() + `<div class="karte aufgabe" style="text-align:center">
    <div style="font-size:3rem">${r[2]}</div><div class="leise">Du wirst befördert zur / zum</div><div class="rang">${esc(r[1])}</div>
    <p><b>${G.richtig} von ${G.gesamt}</b> Akten auf Anhieb richtig (${pct} %) · <b>${G.gespart}</b> Wörter eingespart.</p>
    <div style="max-width:420px;margin:10px auto;text-align:left">${STUFEN.map((s, i) => `<div class="zeile" style="justify-content:space-between;border-bottom:1px dotted #ccc;padding:3px 0"><span>${esc(s.name)}</span><b>${G.stufeRichtig[i]} / ${PRO_STUFE}</b></div>`).join('')}</div>
    ${schwach[0] < PRO_STUFE ? `<p class="leise">Noch üben: <b>${esc(STUFEN[schwach[1]].name)}</b> – siehe Spickzettel.</p>` : ''}
    <div class="knopfreihe">${pct >= 60 ? '<button class="btn" id="zert">🎓 Zertifikat herunterladen</button>' : ''}<button class="btn zweit" id="nochmal">Neue Akten</button><a class="btn zweit" href="index.html">Zur Zentrale</a></div>
    ${pct < 60 ? '<p class="leise klein">Ab 60 % gibt es ein Zertifikat. Die Akten werden jedes Mal neu gemischt.</p>' : ''}</div>`;
  document.getElementById('spick').onclick = spickzettel;
  document.getElementById('nochmal').onclick = neuesSpiel;
  const z = document.getElementById('zert');
  if (z) z.onclick = () => L.zertifikat({ titel: 'Die Satzpresse', zeile: 'Partizip I und II als Adjektiv statt Relativsatz', punkte: `${r[1]} · ${G.richtig}/${G.gesamt} richtig · ${G.gespart} Wörter gespart` });
}

function spickzettel() {
  const d = document.createElement('div'); d.className = 'spick';
  d.innerHTML = `<div class="karte"><div class="zeile" style="justify-content:space-between"><h2 style="margin:0">📒 Spickzettel</h2><button class="btn zweit klein" id="zu">Schließen</button></div>
  <table style="margin-top:12px"><tr><th></th><th>Partizip I</th><th>Partizip II</th></tr>
  <tr><td>Form</td><td>Infinitiv + <b>d</b> + Endung<br>steigen → steigen<b>d</b>e</td><td>Partizip II + Endung<br>bestellen → bestellt<b>e</b></td></tr>
  <tr><td>Bedeutung</td><td><b>aktiv</b>, passiert gerade / ist aktuell</td><td><b>passiv</b>, ist schon passiert / gemacht worden</td></tr>
  <tr><td>Beispiel</td><td>die steigend<b>en</b> Preise<br>= die Preise, die steigen</td><td>die bestellt<b>e</b> Ware<br>= die Ware, die bestellt wurde</td></tr></table>
  <h3 style="margin-top:14px">So wird verdichtet</h3>
  <div class="formel">Artikel + Ergänzungen + Partizip mit Endung + Nomen</div>
  <p class="klein">Die Ware, <u>die vor drei Wochen bei Ihnen</u> bestellt wurde → die <u>vor drei Wochen bei Ihnen</u> bestellt<b>e</b> Ware</p>
  <p class="klein">1. Relativpronomen und Hilfsverb (wurde, ist, hat) fallen weg.<br>2. Alles dazwischen rückt vor das Partizip.<br>3. Das Partizip bekommt die normale <b>Adjektivendung</b>.<br>4. Wer etwas getan hat, steht mit <b>von</b>: den Sie geschickt haben → von Ihnen geschickt.</p>
  <h3 style="margin-top:14px">Achtung</h3>
  <p class="klein">Verben mit <b>sein</b> im Perfekt: Das Partizip II ist <b>aktiv</b>: der angekommene Zug = der Zug, der angekommen ist.<br>
  Partizip I = gleichzeitig: der abfahrende Zug (fährt gerade ab) ↔ der abgefahrene Zug (ist schon weg).</p></div>`;
  document.body.append(d);
  nav.fenster(d);
}

startbild();
</script>
</body>
</html>
